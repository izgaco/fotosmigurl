<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amigo Invisible</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f5f5f5;
  }

  .screen {
    display: none;
    padding: 20px;
    max-width: 600px;
    margin: 50px auto;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  .screen.active {
    display: block;
  }

  h2 {
    text-align: center;
    margin-bottom: 20px;
  }

  input[type="number"], input[type="text"] {
    width: 100%;
    padding: 10px;
    margin: 5px 0 15px 0;
    box-sizing: border-box;
    font-size: 16px;
  }

  button {
    padding: 12px 20px;
    font-size: 16px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    display: block;
    margin: 20px auto 0 auto;
  }

  button:hover {
    background-color: #0056b3;
  }

  .checkbox {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 5px 0;
    flex-wrap: wrap; /* para nombres largos */
    word-break: break-word; /* evita que se salga del contenedor */
  }

  .checkbox input[type="checkbox"] {
    width: 20px;
    height: 20px;
  }

  .checkbox label {
    font-size: 16px;
    flex: 1; /* que ocupe todo el ancho disponible */
  }

  .reveal {
    text-align: center;
    margin-top: 20px;
    padding: 15px;
    background-color: #28a745;
    color: white;
    font-size: 18px;
    border-radius: 5px;
    display: none;
  }

</style>
</head>
<body>

<!-- Pantalla 1: Número de participantes -->
<div id="numScreen" class="screen active">
  <h2>Amigo Invisible</h2>
  <label for="numParticipants">Número de participantes:</label>
  <input type="number" id="numParticipants" min="2" max="20" placeholder="Ej: 5">
  <button onclick="goToNameScreen()">Continuar</button>
</div>

<!-- Pantalla 2: Nombres de los participantes -->
<div id="nameScreen" class="screen">
  <h2>Introduce los nombres de los participantes</h2>
  <div id="namesContainer"></div>
  <button onclick="goToBanScreen()">Continuar</button>
</div>

<!-- Pantalla 3: Selección de no querer regalar a -->
<div id="banScreen" class="screen">
  <h2 id="banTitle"></h2>
  <div id="banContainer"></div>
  <button onclick="nextBan()">Siguiente participante</button>
</div>

<!-- Pantalla 4: Revelar regalo -->
<div id="revealScreen" class="screen">
  <h2>Es tu turno</h2>
  <div id="revealName" class="reveal"></div>
  <button id="nextRevealBtn" onclick="nextReveal()">Siguiente participante</button>
</div>

<script>
let numParticipants = 0;
let participants = [];
let bans = [];
let currentBanIndex = 0;
let assignments = [];

function goToNameScreen() {
  const num = parseInt(document.getElementById('numParticipants').value);
  if(num >= 2) {
    numParticipants = num;
    document.getElementById('numScreen').classList.remove('active');
    document.getElementById('nameScreen').classList.add('active');
    
    const container = document.getElementById('namesContainer');
    container.innerHTML = '';
    for(let i=0; i<numParticipants; i++) {
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = `Nombre participante ${i+1}`;
      input.id = `participant${i}`;
      container.appendChild(input);
    }
  } else {
    alert("Introduce un número válido (mínimo 2).");
  }
}

function goToBanScreen() {
  participants = [];
  for(let i=0; i<numParticipants; i++) {
    const name = document.getElementById(`participant${i}`).value.trim();
    if(name === '') {
      alert('Todos los participantes deben tener nombre.');
      return;
    }
    participants.push(name);
  }

  bans = participants.map(() => []);
  currentBanIndex = 0;

  showBanScreen();
}

function showBanScreen() {
  document.getElementById('nameScreen').classList.remove('active');
  document.getElementById('banScreen').classList.add('active');

  document.getElementById('banTitle').innerText = `Selecciona a quién no quiere regalar ${participants[currentBanIndex]}`;
  const container = document.getElementById('banContainer');
  container.innerHTML = '';

  participants.forEach((p, i) => {
    if(i !== currentBanIndex) {
      const div = document.createElement('div');
      div.className = 'checkbox';
      div.innerHTML = `<label><input type="checkbox" value="${p}"> ${p}</label>`;
      container.appendChild(div);
    }
  });
}

function nextBan() {
  const checkboxes = document.querySelectorAll('#banContainer input[type="checkbox"]');
  bans[currentBanIndex] = [];
  checkboxes.forEach(cb => {
    if(cb.checked) bans[currentBanIndex].push(cb.value);
  });

  currentBanIndex++;
  if(currentBanIndex < participants.length) {
    showBanScreen();
  } else {
    assignGifts();
    document.getElementById('banScreen').classList.remove('active');
    showRevealScreen(0);
  }
}

function assignGifts() {
  // Simple random assignment avoiding banned participants
  const available = [...participants];
  assignments = [];
  
  participants.forEach((p, i) => {
    let options = available.filter(name => !bans[i].includes(name) && name !== p);
    if(options.length === 0) {
      // Si no hay opción, reinicia todo
      alert('No se puede asignar, intenta cambiar las restricciones.');
      location.reload();
      return;
    }
    const choice = options[Math.floor(Math.random() * options.length)];
    assignments.push(choice);
    const index = available.indexOf(choice);
    available.splice(index, 1);
  });
}

let currentReveal = 0;
function showRevealScreen(index) {
  currentReveal = index;
  document.getElementById('revealScreen').classList.add('active');
  document.getElementById('revealName').style.display = 'none';
  document.getElementById('nextRevealBtn').style.display = 'none';
  document.getElementById('revealScreen').querySelector('h2').innerText = `Es el turno de ${participants[index]}`;
  
  const btn = document.createElement('button');
  btn.innerText = 'Revelar a quién regalas';
  btn.onclick = () => {
    document.getElementById('revealName').innerText = assignments[index];
    document.getElementById('revealName').style.display = 'block';
    btn.style.display = 'none';
    document.getElementById('nextRevealBtn').style.display = 'block';
  };
  const revealScreen = document.getElementById('revealScreen');
  revealScreen.appendChild(btn);
}

function nextReveal() {
  currentReveal++;
  if(currentReveal < participants.length) {
    document.getElementById('revealScreen').innerHTML = `
      <h2>Es tu turno</h2>
      <div id="revealName" class="reveal"></div>
      <button id="nextRevealBtn" onclick="nextReveal()">Siguiente participante</button>
    `;
    showRevealScreen(currentReveal);
  } else {
    document.getElementById('revealScreen').innerHTML = '<h2>Todos han recibido su asignación. ¡Feliz Amigo Invisible!</h2>';
  }
}
</script>
</body>
</html>
