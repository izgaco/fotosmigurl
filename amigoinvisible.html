<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Amigo Invisible</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #e0e0e0;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.screen {
  display: none;
  background: white;
  width: 100%;
  max-width: 420px;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 4px 10px rgba(0,0,0,.2);
  text-align: center;
}

.screen.active { display: block; }

h1 { margin-bottom: 15px; }

input, button {
  width: 100%;
  padding: 12px;
  font-size: 18px;
  margin: 8px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button {
  font-weight: bold;
  border: none;
  cursor: pointer;
}

.gray { background: #9e9e9e; color: white; }
.green { background: #2e7d32; color: white; }

.list {
  text-align: left;
  margin-top: 10px;
}

.reveal {
  background: #c8e6c9;
  padding: 15px;
  border-radius: 12px;
  font-size: 22px;
  font-weight: bold;
  margin: 15px 0;
}
</style>
</head>
<body>

<!-- PANTALLA 1 -->
<div id="count" class="screen active">
  <h1>🎁 Amigo Invisible</h1>
  <input type="number" id="numPlayers" min="2" placeholder="Número de participantes">
  <button class="green" onclick="crearInputs()">Continuar</button>
</div>

<!-- PANTALLA 2 -->
<div id="names" class="screen">
  <h1>Participantes</h1>
  <div id="nameInputs"></div>
  <button class="green" onclick="guardarNombres()">Continuar</button>
</div>

<!-- PANTALLA 3 -->
<div id="exclusions" class="screen">
  <h1 id="currentName"></h1>
  <p>Selecciona con quién NO quieres regalar</p>
  <div id="excludeList" class="list"></div>
  <button class="green" onclick="guardarExclusiones()">Siguiente</button>
</div>

<!-- PANTALLA 4 -->
<div id="reveal" class="screen">
  <h1 id="revealName"></h1>
  <button class="green" onclick="revelar()">Revelar a quién regalas</button>
  <div id="result"></div>
  <button class="gray" onclick="siguienteRevelacion()">Siguiente participante</button>
</div>

  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

}

function crearInputs() {
  const n = parseInt(numPlayers.value);
  if (n < 2) return alert("Mínimo 2 participantes");

  nameInputs.innerHTML = "";
  for (let i = 0; i < n; i++) {
    nameInputs.innerHTML += `<input placeholder="Participante ${i+1}">`;
  }
  mostrar('names');
}

/* Pantalla 2 */

  players = [...nameInputs.querySelectorAll('input')]
    .map(i => i.value.trim())
    .filter(Boolean);

  if (players.length < 2) return alert("Rellena todos los nombres");

  players.forEach(p => exclusions[p] = []);
  index = 0;
  mostrarExclusiones();
}

  });
  mostrar('exclusions');
}
