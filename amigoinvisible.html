<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Amigo Invisible</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* =========================
   Estilos generales
========================= */
body {
  margin: 0;
  padding: 0;
  background: #e0e0e0;
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.screen {
  display: none;
  background: #ffffff;
  width: 100%;
  max-width: 420px;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  text-align: center;
}

.screen.active {
  display: block;
}

h1 { margin-bottom: 10px; }

button {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  font-size: 18px;
  font-weight: bold;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

.gray { background: #9e9e9e; color: white; }
.green { background: #2e7d32; color: white; }

input[type="text"], input[type="number"] {
  width: 100%;
  padding: 12px;
  font-size: 18px;
  margin: 8px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

label {
  display: block;
  text-align: left;
  font-weight: bold;
  margin-top: 10px;
  margin-bottom: 4px;
}

/* =========================
   ESTILOS DE EXCLUSIONES (CORREGIDOS)
========================= */
.checkbox-container {
  display: flex;
  align-items: center;
  background: #f5f5f5;
  margin: 8px 0;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.2s;
}

.checkbox-container:hover {
  background: #eeeeee;
}

/* Forzamos que el checkbox sea visible y tenga tamaño */
.checkbox-container input[type="checkbox"] {
  width: 22px;
  height: 22px;
  margin-right: 15px; /* Espacio entre cuadro y nombre */
  cursor: pointer;
  flex-shrink: 0; /* Evita que el cuadro se aplaste */
}

.checkbox-container label {
  margin: 0;
  flex-grow: 1;
  cursor: pointer;
  font-weight: normal;
  text-align: left;
}

.result-box {
  padding: 15px;
  margin: 10px 0;
  border-radius: 12px;
  background: #2e7d32;
  color: white;
  font-size: 22px;
  font-weight: bold;
}
</style>
</head>
<body>

<div id="numParticipants" class="screen active">
  <h1>👥 Amigo Invisible</h1>
  <label for="num">Número de participantes</label>
  <input id="num" type="number" min="2" placeholder="Ej: 5">
  <button class="green" onclick="generarInputs()">Continuar</button>
</div>

<div id="participants" class="screen">
  <h1>✏️ Nombres</h1>
  <div id="participantInputs"></div>
  <button class="green" onclick="guardarParticipantes()">Continuar</button>
  <button class="gray" onclick="mostrar('numParticipants')">Volver</button>
</div>

<div id="exclusions" class="screen">
  <h1>🚫 Exclusiones</h1>
  <div id="exclusionList"></div>
  <button class="green" onclick="guardarExclusiones()">Continuar</button>
</div>

<div id="reveal" class="screen">
  <h1>🎁 Revelar regalos</h1>
  <div id="currentParticipant" style="font-size:22px;font-weight:bold;margin-bottom:10px"></div>
  <button class="green" id="revealBtn" onclick="revelar()">Revelar a quién regalas</button>
  <div id="giftBox" class="result-box" style="display:none;"></div>
  <button class="gray" id="nextParticipantBtn" style="display:none;" onclick="siguiente()">Siguiente participante</button>
</div>

<script>
let participants = [];
let exclusions = {};
let currentIndex = 0;
let gifts = {};

function mostrar(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function generarInputs() {
  const n = parseInt(document.getElementById('num').value);
  if (isNaN(n) || n < 2) { alert("Introduce al menos 2 participantes"); return; }
  const container = document.getElementById('participantInputs');
  container.innerHTML = '';
  for (let i=0; i<n; i++) {
    container.innerHTML += `
      <label>Participante ${i+1}</label>
      <input id="p${i}" type="text" placeholder="Nombre">
    `;
  }
  mostrar('participants');
}

function guardarParticipantes() {
  participants = [];
  const inputs = document.querySelectorAll('#participantInputs input');
  for (let input of inputs) {
    const name = input.value.trim();
    if (!name) { alert("Rellena todos los nombres"); return; }
    participants.push(name);
  }
  currentIndex = 0;
  mostrarExclusion(currentIndex);
}

function mostrarExclusion(idx) {
  const container = document.getElementById('exclusionList');
  container.innerHTML = `<h3>¿A quién NO puede regalar ${participants[idx]}?</h3>`;
  
  participants.forEach((p, i) => {
    if (p !== participants[idx]) {
      // Usamos un div contenedor para manejar el diseño
      container.innerHTML += `
        <div class="checkbox-container">
          <input type="checkbox" id="ex_${idx}_${i}" value="${p}">
          <label for="ex_${idx}_${i}">${p}</label>
        </div>
      `;
    }
  });
  mostrar('exclusions');
}

function guardarExclusiones() {
  const pName = participants[currentIndex];
  exclusions[pName] = [];
  
  const checkboxes = document.querySelectorAll(`#exclusionList input[type="checkbox"]`);
  checkboxes.forEach(cb => {
    if (cb.checked) {
      exclusions[pName].push(cb.value);
    }
  });

  currentIndex++;
  if (currentIndex < participants.length) {
    mostrarExclusion(currentIndex);
  } else {
    asignarRegalos();
  }
}

function asignarRegalos() {
  let intentos = 0;
  let exito = false;
  while (intentos < 500 && !exito) {
    let disponibles = [...participants];
    gifts = {};
    exito = true;
    for (let p of participants) {
      let posibles = disponibles.filter(x => x !== p && !exclusions[p].includes(x));
      if (posibles.length === 0) { exito = false; break; }
      const elegido = posibles[Math.floor(Math.random()*posibles.length)];
      gifts[p] = elegido;
      disponibles = disponibles.filter(x => x !== elegido);
    }
    intentos++;
  }

  if (!exito) {
    alert("Imposible asignar con esas exclusiones. Reintenta.");
    currentIndex = 0;
    mostrarExclusion(0);
  } else {
    currentIndex = 0;
    document.getElementById('giftBox').style.display='none';
    document.getElementById('revealBtn').style.display='block';
    document.getElementById('nextParticipantBtn').style.display='none';
    mostrar('reveal');
    actualizarRevelar();
  }
}

function actualizarRevelar() {
  document.getElementById('currentParticipant').textContent = "Turno de: " + participants[currentIndex];
}

function revelar() {
  document.getElementById('giftBox').textContent = "Regalas a: " + gifts[participants[currentIndex]];
  document.getElementById('giftBox').style.display='block';
  document.getElementById('revealBtn').style.display='none';
  document.getElementById('nextParticipantBtn').style.display='block';
}

function siguiente() {
  currentIndex++;
  if (currentIndex < participants.length) {
    document.getElementById('giftBox').style.display='none';
    document.getElementById('revealBtn').style.display='block';
    document.getElementById('nextParticipantBtn').style.display='none';
    actualizarRevelar();
  } else {
    alert("¡Reparto finalizado!");
    location.reload();
  }
}
</script>
</body>
</html>
