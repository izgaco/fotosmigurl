<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Amigo Invisible</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* =========================
   Estilos generales
========================= */
body {
  margin: 0;
  padding: 0;
  background: #e0e0e0;
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.screen {
  display: none;
  background: #ffffff;
  width: 100%;
  max-width: 420px;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  text-align: center;
}

.screen.active {
  display: block;
}

h1 { margin-bottom: 10px; }

button {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  font-size: 18px;
  font-weight: bold;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

.red { background: #c62828; color: white; }
.blue { background: #1565c0; color: white; }
.gray { background: #9e9e9e; color: white; }
.green { background: #2e7d32; color: white; }

input[type="text"], input[type="number"] {
  width: 100%;
  padding: 12px;
  font-size: 18px;
  margin: 8px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

label {
  display: block;
  text-align: left;
  font-weight: bold;
  margin-top: 10px;
  margin-bottom: 4px;
}

/* =========================
   AJUSTE: Estilos de exclusiones
========================= */
.checkbox {
  display: flex;
  align-items: center; /* Centra verticalmente el check con el texto */
  gap: 12px;
  margin: 6px 0;
  padding: 10px;
  border-radius: 6px;
  background: #f5f5f5;
  cursor: pointer;
}

.checkbox input[type="checkbox"] {
  width: 20px;   /* Tamaño fijo para el check */
  height: 20px;
  margin: 0;     /* Quita márgenes extra */
  cursor: pointer;
}

.checkbox label {
  margin: 0;     /* Quita el margen superior del label general */
  flex-grow: 1;  /* El texto ocupa el espacio restante */
  cursor: pointer;
  font-weight: normal;
}

.result-box {
  padding: 15px;
  margin: 10px 0;
  border-radius: 12px;
  background: #2e7d32;
  color: white;
  font-size: 22px;
  font-weight: bold;
}
</style>
</head>
<body>

<div id="numParticipants" class="screen active">
  <h1>👥 Amigo Invisible</h1>
  <label for="num">Número de participantes</label>
  <input id="num" type="number" min="2" placeholder="Ej: 5">
  <button class="green" onclick="generarInputs()">Continuar</button>
</div>

<div id="participants" class="screen">
  <h1>✏️ Nombres</h1>
  <div id="participantInputs"></div>
  <button class="green" onclick="guardarParticipantes()">Continuar</button>
  <button class="gray" onclick="mostrar('numParticipants')">Volver</button>
</div>

<div id="exclusions" class="screen">
  <h1>🚫 Exclusiones</h1>
  <p>Marca a quién <strong>NO</strong> puede regalar:</p>
  <div id="exclusionList"></div>
  <button class="green" onclick="guardarExclusiones()">Continuar</button>
</div>

<div id="reveal" class="screen">
  <h1>🎁 Revelar regalos</h1>
  <div id="currentParticipant" style="font-size:22px;font-weight:bold;margin-bottom:10px"></div>
  <button class="green" id="revealBtn" onclick="revelar()">Revelar a quién regalas</button>
  <div id="giftBox" class="result-box" style="display:none;"></div>
  <button class="gray" id="nextParticipantBtn" style="display:none;" onclick="siguiente()">Siguiente participante</button>
</div>

<script>
let participants = [];
let exclusions = {};
let currentIndex = 0;
let gifts = {};

function mostrar(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function generarInputs() {
  const n = parseInt(document.getElementById('num').value);
  if (isNaN(n) || n < 2) { alert("Introduce al menos 2 participantes"); return; }
  const container = document.getElementById('participantInputs');
  container.innerHTML = '';
  for (let i=0; i<n; i++) {
    container.innerHTML += `
      <label for="p${i}">Participante ${i+1}</label>
      <input id="p${i}" type="text" placeholder="Nombre">
    `;
  }
  mostrar('participants');
}

function guardarParticipantes() {
  participants = [];
  const n = document.getElementById('participantInputs').querySelectorAll('input').length;
  for (let i=0;i<n;i++) {
    const name = document.getElementById(`p${i}`).value.trim();
    if (!name) { alert("Rellena todos los nombres"); return; }
    participants.push(name);
  }
  exclusions = {};
  participants.forEach(p => exclusions[p] = []);
  currentIndex = 0;
  mostrarExclusion(currentIndex);
}

// =========================
// AJUSTE: Orden de Checkbox e Input
// =========================
function mostrarExclusion(idx) {
  const container = document.getElementById('exclusionList');
  container.innerHTML = `<h3>¿A quién NO puede regalar ${participants[idx]}?</h3>`;
  participants.forEach(p => {
    if (p !== participants[idx]) {
      container.innerHTML += `
        <div class="checkbox" onclick="this.querySelector('input').click()">
          <input type="checkbox" id="ex_${idx}_${p}" value="${p}" onclick="event.stopPropagation()">
          <label for="ex_${idx}_${p}">${p}</label>
        </div>
      `;
    }
  });
  mostrar('exclusions');
}

function guardarExclusiones() {
  const idx = currentIndex;
  const pName = participants[idx];
  exclusions[pName] = [];
  participants.forEach(p => {
    if (p !== pName) {
      const cb = document.getElementById(`ex_${idx}_${p}`);
      if (cb && cb.checked) {
        exclusions[pName].push(p);
      }
    }
  });
  currentIndex++;
  if (currentIndex < participants.length) {
    mostrarExclusion(currentIndex);
  } else {
    asignarRegalos();
  }
}

function asignarRegalos() {
  let intentos = 0;
  let exito = false;
  
  while (intentos < 100 && !exito) {
    let disponibles = [...participants];
    gifts = {};
    exito = true;

    for (let p of participants) {
      let posibles = disponibles.filter(x => x !== p && !exclusions[p].includes(x));
      if (posibles.length === 0) {
        exito = false;
        break;
      }
      const elegido = posibles[Math.floor(Math.random()*posibles.length)];
      gifts[p] = elegido;
      disponibles = disponibles.filter(x => x !== elegido);
    }
    intentos++;
  }

  if (!exito) {
    alert("No se pudo generar una asignación válida. Hay demasiadas exclusiones.");
    currentIndex = 0;
    mostrarExclusion(0);
  } else {
    currentIndex = 0;
    document.getElementById('giftBox').style.display='none';
    document.getElementById('revealBtn').style.display='inline-block';
    document.getElementById('nextParticipantBtn').style.display='none';
    mostrar('reveal');
    actualizarRevelar();
  }
}

function actualizarRevelar() {
  document.getElementById('currentParticipant').textContent = "Turno de: " + participants[currentIndex];
}

function revelar() {
  document.getElementById('giftBox').textContent = "Te toca regalar a: " + gifts[participants[currentIndex]];
  document.getElementById('giftBox').style.display='block';
  document.getElementById('revealBtn').style.display='none';
  document.getElementById('nextParticipantBtn').style.display='inline-block';
}

function siguiente() {
  currentIndex++;
  if (currentIndex < participants.length) {
    document.getElementById('giftBox').style.display='none';
    document.getElementById('revealBtn').style.display='inline-block';
    document.getElementById('nextParticipantBtn').style.display='none';
    actualizarRevelar();
  } else {
    alert("¡Reparto terminado! 🎉");
    location.reload(); 
  }
}
</script>
</body>
</html>
