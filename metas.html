<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Metas 2026</title><style>
:root {
  --bg: #f4f6fb;
  --primary-light: #a5b4fc;
  --primary: #4f46e5;
  --water-2: #dbeafe;
  --water-4: #bfdbfe;
  --water-6: #60a5fa;
  --water-8: #4f46e5;
  --exercise-strength: #fecaca;
  --exercise-cardio: #fde68a;
  --exercise-rest: #bbf7d0;
  --tick-green: #bbf7d0;
  --cross-red: #fecaca;
  --emotional-bad: #f87171;
  --emotional-normal: #86efac;
  --emotional-good: #4ade80;
  --emotional-great: #16a34a;
  --skincare-journal: #bbf7d0;
  --skincare-skin: #16a34a;
  --skincare-both: #93c5fd;
  --reading-0: #f87171;
  --reading-10: #86efac;
  --reading-20: #4ade80;
  --reading-30: #16a34a;
  --blank-gray: #e5e7eb;
}

body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); }
.screen { display:none; padding:16px; }
.screen.active { display:block; }
h2 { text-align:center; margin-top:0; }
button { border:none; padding:14px; border-radius:12px; font-weight:600; background:var(--primary-light); }
button.secondary { background:#e5e7eb; }
button.blank { background:var(--blank-gray); }
.menu { display:flex; justify-content:center; margin-bottom:16px; }
.menu select { width:100%; max-width:320px; padding:14px; border-radius:14px; border:none; background:var(--primary-light); font-weight:600; }
.calendar-grid { display:grid; grid-template-columns:28px repeat(12,1fr); gap:4px; font-size:11px; }
.calendar-cell { height:28px; background:#fff; display:flex; align-items:center; justify-content:center; border-radius:6px; cursor:pointer; }
.calendar-cell.header { background:#eef2ff; font-weight:700; cursor:default; }
.calendar-cell.day { background:#f1f5f9; font-weight:700; cursor:default; }
.calendar-cell.water-2 { background:var(--water-2); }
.calendar-cell.water-4 { background:var(--water-4); }
.calendar-cell.water-6 { background:var(--water-6); }
.calendar-cell.water-8 { background:var(--water-8); color:#fff; }
.calendar-cell.exercise-strength { background:var(--exercise-strength); }
.calendar-cell.exercise-cardio { background:var(--exercise-cardio); }
.calendar-cell.exercise-rest { background:var(--exercise-rest); }
.calendar-cell.tick { background:var(--tick-green); }
.calendar-cell.cross { background:var(--cross-red); }
.calendar-cell.bad { background:var(--emotional-bad); }
.calendar-cell.normal { background:var(--emotional-normal); }
.calendar-cell.good { background:var(--emotional-good); }
.calendar-cell.great { background:var(--emotional-great); }
.calendar-cell.skincare-journal { background:var(--skincare-journal); }
.calendar-cell.skincare-skin { background:var(--skincare-skin); color:#fff; }
.calendar-cell.skincare-both { background:var(--skincare-both); }
.calendar-cell.reading-0 { background:var(--reading-0); }
.calendar-cell.reading-10 { background:var(--reading-10); }
.calendar-cell.reading-20 { background:var(--reading-20); }
.calendar-cell.reading-30 { background:var(--reading-30); color:#fff; }

.modal { position:fixed; inset:0; display:none; background:rgba(0,0,0,.5); align-items:center; justify-content:center; }
.modal.active { display:flex; }
.modal-box { background:#fff; padding:20px; width:90%; max-width:320px; border-radius:16px; }
.modal-box button { width:100%; margin-top:10px; }
</style></head>
<body><div id="screen-user" class="screen active">
  <h2>¿Quién hace el seguimiento?</h2>
  <button onclick="selectUser('Izhar')">Izhar</button>
  <button onclick="selectUser('Camila')">Camila</button>
</div><div id="screen-izhar" class="screen">
  <button class="secondary" onclick="volverUsuario()">Volver</button>
  <h2>Izhar · Metas 2026</h2>
  <div id="izhar-biblia"></div>
  <div id="izhar-ejercicio"></div>
</div><div id="screen-camila" class="screen">
  <button class="secondary" onclick="volverUsuario()">Volver</button>
  <h2>Camila · Metas 2026</h2>
  <div id="camila-emocional"></div>
  <div id="camila-agua"></div>
  <div id="camila-skincare"></div>
  <div id="camila-lectura"></div>
</div><div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modal-title"></h3>
    <div id="modal-options"></div>
    <button class="secondary" onclick="closeModal()">Cancelar</button>
  </div>
</div><script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js';

const app = initializeApp({ apiKey:'AIzaSyCBSbcwyQCz7p5tYHhv0yQT-Q_Mn4M8dro', projectId:'migurl-metas' });
const db = getFirestore(app);

const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

const CALENDARS = {
  biblia: {
    options: [
      { label:'✅ Leído', class:'tick', emoji:'✅' },
      { label:'❌ No leído', class:'cross', emoji:'❌' }
    ]
  },
  ejercicio: {
    options: [
      { label:'🏋️ Fuerza', class:'exercise-strength', emoji:'🏋️' },
      { label:'🏃 Cardio', class:'exercise-cardio', emoji:'🏃' },
      { label:'🛌 Descanso', class:'exercise-rest', emoji:'🛌' }
    ]
  },
  emocional: {
    options: [
      { label:'😞', class:'bad', emoji:'😞' },
      { label:'😐', class:'normal', emoji:'😐' },
      { label:'🙂', class:'good', emoji:'🙂' },
      { label:'🤩', class:'great', emoji:'🤩' }
    ]
  },
  agua: {
    options: [
      { label:'2 💧', class:'water-2', emoji:'💧' },
      { label:'4 💧', class:'water-4', emoji:'💧' },
      { label:'6 💧', class:'water-6', emoji:'💧' },
      { label:'8 💧', class:'water-8', emoji:'💧' }
    ]
  },
  skincare: {
    options: [
      { label:'📓', class:'skincare-journal', emoji:'📓' },
      { label:'🧴', class:'skincare-skin', emoji:'🧴' },
      { label:'⭐', class:'skincare-both', emoji:'⭐' }
    ]
  },
  lectura: {
    options: [
      { label:'❌', class:'reading-0', emoji:'❌' },
      { label:'📖', class:'reading-10', emoji:'📖' },
      { label:'📖', class:'reading-20', emoji:'📖' },
      { label:'📖', class:'reading-30', emoji:'📖' }
    ]
  }
};

let current = null;

window.selectUser = u => {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(u==='Izhar'?'screen-izhar':'screen-camila').classList.add('active');
  if(u==='Izhar'){
    render('Izhar','biblia',izhar-biblia);
    render('Izhar','ejercicio',izhar-ejercicio);
  } else {
    render('Camila','emocional',camila-emocional);
    render('Camila','agua',camila-agua);
    render('Camila','skincare',camila-skincare);
    render('Camila','lectura',camila-lectura);
  }
};

window.volverUsuario = () => location.reload();

function render(user,type,container){
  container.innerHTML='';
  const grid=document.createElement('div'); grid.className='calendar-grid';
  grid.appendChild(document.createElement('div'));
  months.forEach(m=>{ const h=document.createElement('div'); h.textContent=m.slice(0,3); h.className='calendar-cell header'; grid.appendChild(h); });
  for(let d=1;d<=31;d++){
    const day=document.createElement('div'); day.textContent=d; day.className='calendar-cell day'; grid.appendChild(day);
    months.forEach((_,m)=>{
      const cell=document.createElement('div'); cell.className='calendar-cell';
      cell.onclick=()=>openModal(user,type,d,m,cell);
      grid.appendChild(cell);
      loadCell(user,type,d,m,cell);
    });
  }
  container.appendChild(grid);
}

async function loadCell(user,type,day,month,cell){
  const key=`${user}_${type}_${day}_${month}`;
  const snap=await getDoc(doc(db,'metas',key));
  if(!snap.exists()) return;
  const v=snap.data();
  cell.className='calendar-cell';
  if(v.class) cell.classList.add(v.class);
  if(v.emoji) cell.textContent=v.emoji;
}

function openModal(user,type,day,month,cell){
  current={user,type,day,month,cell};
  modal-options.innerHTML='';
  modal-title.textContent=`${day} de ${months[month]}`;
  CALENDARS[type].options.forEach(o=>addOpt(o));
  addOpt({label:'Vaciar',class:'blank'});
  modal.classList.add('active');
}

function addOpt(opt){
  const b=document.createElement('button');
  b.textContent=opt.label;
  if(opt.class==='blank') b.className='blank';
  b.onclick=async()=>{
    const {user,type,day,month,cell}=current;
    const key=`${user}_${type}_${day}_${month}`;
    if(opt.class==='blank'){
      cell.textContent=''; cell.className='calendar-cell';
      await deleteDoc(doc(db,'metas',key)); closeModal(); return;
    }
    cell.className='calendar-cell';
    cell.classList.add(opt.class);
    cell.textContent=opt.emoji;
    await setDoc(doc(db,'metas',key),{class:opt.class,emoji:opt.emoji});
    closeModal();
  };
  modal-options.appendChild(b);
}

window.closeModal=()=>modal.classList.remove('active');
</script></body>
</html>
