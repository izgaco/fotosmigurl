<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Metas 2026</title>
<style>
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --primary: #4f46e5;
  --primary-light: #a5b4fc;
  --water-2: #dbeafe;
  --water-4: #bfdbfe;
  --water-6: #60a5fa;
  --water-8: #4f46e5;
  --exercise-strength: #fecaca;
  --exercise-cardio: #fde68a;
  --exercise-rest: #bbf7d0;
  --tick-green: #bbf7d0;
  --cross-red: #fecaca;
  --emotional-bad: #f87171;
  --emotional-normal: #86efac;
  --emotional-good: #4ade80;
  --emotional-great: #16a34a;
  --skincare-journal: #bbf7d0;
  --skincare-skin: #16a34a;
  --skincare-both: #93c5fd;
  --reading-0: #f87171;
  --reading-10: #86efac;
  --reading-20: #4ade80;
  --reading-30: #16a34a;
  --blank-gray: #e5e7eb;
  --text: #1f2937;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
.screen { display: none; padding: 16px; }
.screen.active { display: block; }
h2 { margin-top: 0; text-align: center; }
button { border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; background: var(--primary-light); color: #111; }
button.active { background: var(--primary); color: #fff; }
button.secondary { background: #e5e7eb; color: #111; }
.user-select { display: grid; gap: 16px; margin-top: 40px; }
.menu { display: flex; justify-content: center; margin-bottom: 16px; }
.menu select { width: 100%; max-width: 320px; padding: 14px; border-radius: 14px; border: none; font-size: 16px; font-weight: 600; background: var(--primary-light); color: #111; appearance: none; text-align: center; }
.calendar-grid { display: grid; grid-template-columns: 28px repeat(12, 1fr); gap: 4px; font-size: 11px; margin-top: 12px; }
.calendar-cell { background: #ffffff; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; user-select: none; }
.calendar-cell.header { font-weight: 700; background: #eef2ff; cursor: default; }
.calendar-cell.day { font-weight: 700; background: #f1f5f9; cursor: default; }
.calendar-cell.blank { background: var(--blank-gray); }

/* === COLORES DE CASILLAS SEGÚN CLASE === */
.calendar-cell.tick { background: var(--tick-green); }
.calendar-cell.cross { background: var(--cross-red); }

.calendar-cell.exercise-strength { background: var(--exercise-strength); }
.calendar-cell.exercise-cardio { background: var(--exercise-cardio); }
.calendar-cell.exercise-rest { background: var(--exercise-rest); }

.calendar-cell.bad { background: var(--emotional-bad); }
.calendar-cell.normal { background: var(--emotional-normal); }
.calendar-cell.good { background: var(--emotional-good); }
.calendar-cell.great { background: var(--emotional-great); }

.calendar-cell.water-2 { background: var(--water-2); }
.calendar-cell.water-4 { background: var(--water-4); }
.calendar-cell.water-6 { background: var(--water-6); }
.calendar-cell.water-8 { background: var(--water-8); }

.calendar-cell.skincare-journal { background: var(--skincare-journal); }
.calendar-cell.skincare-skin { background: var(--skincare-skin); }
.calendar-cell.skincare-both { background: var(--skincare-both); }

.calendar-cell.reading-0 { background: var(--reading-0); }
.calendar-cell.reading-10 { background: var(--reading-10); }
.calendar-cell.reading-20 { background: var(--reading-20); }
.calendar-cell.reading-30 { background: var(--reading-30); }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 10; }
.modal.active { display: flex; }
.modal-box { background: white; width: 90%; max-width: 320px; padding: 20px; border-radius: 16px; }
.modal-box h3 { margin-top: 0; }
.modal-box button { width: 100%; margin-top: 10px; }
.modal-box button.blank { background: var(--blank-gray); color: #111; }
</style>
</head>
<body>
<div id="screen-user" class="screen active">
  <h2>¿Quién hace el seguimiento?</h2>
  <div class="user-select">
    <button onclick="selectUser('Izhar')">Izhar</button>
    <button onclick="selectUser('Camila')">Camila</button>
  </div>
</div>
<div id="screen-izhar" class="screen">
  <button class="secondary" onclick="volverUsuario()">Volver</button>
  <h2>Izhar · Metas 2026</h2>
  <div class="menu">
    <select id="select-izhar" onchange="showIzharSection(this.value)">
      <option value="" selected>- Seleccionar -</option>
      <option value="peso">⚖️ Peso y medidas</option>
      <option value="biblia">📖 Lectura de la Biblia</option>
      <option value="ejercicio">💪 Ejercicio</option>
    </select>
  </div>
  <div id="izhar-biblia"></div>
  <div id="izhar-ejercicio" style="display:none"></div>
  <div id="izhar-peso" style="display:none"></div>
</div>
<div id="screen-camila" class="screen">
  <button class="secondary" onclick="volverUsuario()">Volver</button>
  <h2>Camila · Metas 2026</h2>
  <div class="menu">
    <select id="select-camila" onchange="showCamilaSection(this.value)">
      <option value="" selected>- Seleccionar -</option>
      <option value="emocional">💭 Año emocional</option>
      <option value="agua">💧 Beber agua</option>
      <option value="skincare">🧴 Skincare</option>
      <option value="lectura">📚 Lectura</option>
      <option value="ejercicio">💪 Ejercicio</option>
    </select>
  </div>
  <div id="camila-emocional"></div>
  <div id="camila-agua" style="display:none"></div>
  <div id="camila-skincare" style="display:none"></div>
  <div id="camila-lectura" style="display:none"></div>
  <div id="camila-ejercicio" style="display:none"></div>
</div>
<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modal-title">Selecciona</h3>
    <div id="modal-options"></div>
    <button class="secondary" onclick="closeModal()">Cancelar</button>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCBSbcwyQCz7p5tYHhv0yQT-Q_Mn4M8dro", authDomain: "migurl-metas.firebaseapp.com", projectId: "migurl-metas" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const monthsFull = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const monthsShort = monthsFull.map(m => m.slice(0,3).toUpperCase());
let currentContext = null;
const cellLocks = {};

const CALENDARS = {
  camila_ejercicio: { options: [ { label: '🛌 Descanso', class: 'exercise-rest', emoji: '🛌' }, { label: '🏋️ 20 minutos', class: 'exercise-strength', emoji: '🏋️' }, { label: '🚶 Paseo', class: 'exercise-cardio', emoji: '🚶' } ] },
  biblia: { options: [ { label: '✅ Leído', class: 'tick', emoji: '✅' }, { label: '❌ No leído', class: 'cross', emoji: '❌' } ] },
  ejercicio: { options: [ { label: '🏋️ Fuerza', class: 'exercise-strength', emoji: '🏋️' }, { label: '🏃 Cardio', class: 'exercise-cardio', emoji: '🏃' }, { label: '🛌 Descanso', class: 'exercise-rest', emoji: '🛌' } ] },
  emocional: { options: [ { label: '😞', class: 'bad', emoji: '😞' }, { label: '😐', class: 'normal', emoji: '😐' }, { label: '🙂', class: 'good', emoji: '🙂' }, { label: '🤩', class: 'great', emoji: '🤩' } ] },
  agua: { options: [ { label: '2 Vasos 💧', class: 'water-2', emoji: '💧' }, { label: '4 Vasos 💧', class: 'water-4', emoji: '💧' }, { label: '6 Vasos 💧', class: 'water-6', emoji: '💧' }, { label: '8 Vasos 💧', class: 'water-8', emoji: '💧' } ] },
  skincare: { options: [ { label: '📓 Journal', class: 'skincare-journal', emoji: '📓' }, { label: '🧴 Skincare', class: 'skincare-skin', emoji: '🧴' }, { label: '⭐ Ambas', class: 'skincare-both', emoji: '⭐' } ] },
  lectura: { options: [ { label: 'No he leído', class: 'reading-0', emoji: '❌' }, { label: '0-10 páginas', class: 'reading-10', emoji: '📖' }, { label: '10-20 páginas', class: 'reading-20', emoji: '📖' }, { label: 'Más de 20 páginas', class: 'reading-30', emoji: '📖' } ] }
};

window.volverUsuario = () => {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-user').classList.add('active');
};

window.selectUser = (user) => {
  document.getElementById('screen-user').classList.remove('active');
  document.getElementById(user==='Izhar'?'screen-izhar':'screen-camila').classList.add('active');
  if(user==='Izhar'){
  // No renderizamos ningún calendario al inicio
    } else {
    //Me dice chatGPT que borre lo que había aquí
    }
};

// Guardamos qué calendarios ya se han renderizado
const izharRendered = {
  peso: false,
  biblia: false,
  ejercicio: false
};

window.showIzharSection = (section) => {
  const biblia = document.getElementById('izhar-biblia');
  const ejercicio = document.getElementById('izhar-ejercicio');
  const peso = document.getElementById('izhar-peso');

  // Si no se ha seleccionado nada, ocultamos todo
  if(section === "") {
    biblia.style.display = 'none';
    ejercicio.style.display = 'none';
    peso.style.display = 'none';
    return;
  }

  // Mostrar/ocultar según selección
  biblia.style.display = section==='biblia'?'block':'none';
  ejercicio.style.display = section==='ejercicio'?'block':'none';
  peso.style.display = section==='peso'?'block':'none';

  // Renderizar solo si no se ha renderizado todavía
  if(section === 'biblia' && !izharRendered.biblia) {
    renderCalendar('Izhar','biblia',biblia);
    izharRendered.biblia = true;
  }
  if(section === 'ejercicio' && !izharRendered.ejercicio) {
    renderCalendar('Izhar','ejercicio',ejercicio);
    izharRendered.ejercicio = true;
  }
  if(section === 'peso' && !izharRendered.peso) {
    renderPesoCalendar('Izhar', peso);
    izharRendered.peso = true;
  }
};

// Guardamos qué calendarios ya se han renderizado para Camila
const camilaRendered = {
  emocional: false,
  agua: false,
  skincare: false,
  lectura: false,
  ejercicio: false
};

window.showCamilaSection = (section) => {
  const emocional = document.getElementById('camila-emocional');
  const agua = document.getElementById('camila-agua');
  const skincare = document.getElementById('camila-skincare');
  const lectura = document.getElementById('camila-lectura');
  const ejercicio = document.getElementById('camila-ejercicio');

  // Si no se ha seleccionado nada, ocultamos todo
  if(section === "") {
    [emocional, agua, skincare, lectura, ejercicio].forEach(el => el.style.display='none');
    return;
  }

  // Mostrar/ocultar según selección
  emocional.style.display = section==='emocional'?'block':'none';
  agua.style.display = section==='agua'?'block':'none';
  skincare.style.display = section==='skincare'?'block':'none';
  lectura.style.display = section==='lectura'?'block':'none';
  ejercicio.style.display = section==='ejercicio'?'block':'none';

  // Renderizar solo si no se ha renderizado todavía
  if(section==='emocional' && !camilaRendered.emocional) {
    renderCalendar('Camila','emocional',emocional);
    camilaRendered.emocional = true;
  }
  if(section==='agua' && !camilaRendered.agua) {
    renderCalendar('Camila','agua',agua);
    camilaRendered.agua = true;
  }
  if(section==='skincare' && !camilaRendered.skincare) {
    renderCalendar('Camila','skincare',skincare);
    camilaRendered.skincare = true;
  }
  if(section==='lectura' && !camilaRendered.lectura) {
    renderCalendar('Camila','lectura',lectura);
    camilaRendered.lectura = true;
  }
  if(section==='ejercicio' && !camilaRendered.ejercicio) {
    renderCalendar('Camila','camila_ejercicio',ejercicio);
    camilaRendered.ejercicio = true;
  }
};

window.showSection = (section) => {
  ['emocional','agua','skincare','lectura','ejercicio'].forEach(s=>{
    const el=document.getElementById('camila-'+s);
    if(el) el.style.display=s===section?'block':'none';
  });
};

function renderPesoCalendar(user, container){
  container.innerHTML='';
  const grid=document.createElement('div');
  grid.style.display='grid';
  grid.style.gridTemplateColumns='80px repeat(3,1fr)';
  grid.style.gap='4px';

  ['Fecha','Peso (kg)','Espalda (cm)','Barriga (cm)'].forEach(h=>{
    const c=document.createElement('div');
    c.className='calendar-cell header';
    c.textContent=h;
    grid.appendChild(c);
  });

  const weeks=[];
  let d=new Date(2026,0,1);
  while(d.getFullYear()===2026){
    weeks.push(new Date(d));
    d.setDate(d.getDate()+7);
  }

  weeks.forEach(date=>{
    const label=`${date.getDate()} - ${monthsShort[date.getMonth()]}`;
    const day=document.createElement('div'); day.className='calendar-cell day'; day.textContent=label; grid.appendChild(day);
    ['peso','espalda','barriga'].forEach(type=>{
      const cell=document.createElement('div'); cell.className='calendar-cell';
      cell.onclick=()=>openPesoModal(user,type,label,cell);
      grid.appendChild(cell);
      loadPesoCell(user,type,label,cell);
    });
  });

  container.appendChild(grid);
}

function renderCalendar(user,type,container){
  container.innerHTML='';
  const grid = document.createElement('div');
  grid.className='calendar-grid';
  grid.appendChild(document.createElement('div'));
  monthsShort.forEach(m=>{ const c=document.createElement('div'); c.className='calendar-cell header'; c.textContent=m; grid.appendChild(c); });
  for(let d=1; d<=31; d++){
    const day=document.createElement('div'); day.className='calendar-cell day'; day.textContent=d; grid.appendChild(day);
    monthsFull.forEach((_,mi)=>{
      const cell=document.createElement('div'); cell.className='calendar-cell'; cell.onclick=()=>openModal(user,type,d,mi,cell); grid.appendChild(cell); loadCell(user,type,d,mi,cell);
    });
  }
  container.appendChild(grid);
}

async function loadCell(user,type,day,month,cell){
  const key=`${user}_${type}_${day}_${month}`;
  if(cellLocks[key]) return;
  cellLocks[key]=true;
  const snap = await getDoc(doc(db,'metas',key));
  if(snap.exists()){
    const v = snap.data();
    cell.textContent = '';
    cell.className = 'calendar-cell';
    if(v.class) cell.classList.add(v.class);
    if(v.emoji) cell.textContent = v.emoji;
  }
  cellLocks[key]=false;
}

async function loadPesoCell(user,type,label,cell){
  const key=`${user}_peso_${type}_${label}`;
  const snap=await getDoc(doc(db,'metas',key));
  if(snap.exists()) cell.textContent=snap.data().value;
}

window.openPesoModal=(user,type,label,cell)=>{
  currentContext={user,type,label,cell,isPeso:true};
  const opts=document.getElementById('modal-options');
  opts.innerHTML='';
  document.getElementById('modal-title').textContent=label;

  const input=document.createElement('input');
  input.type='number';
  input.style.width='100%';
  input.placeholder= type==='peso'?'kg':'cm';
  opts.appendChild(input);

  const save=document.createElement('button');
  save.textContent='Guardar';
  save.onclick=async()=>{
    const key=`${user}_peso_${type}_${label}`;
    cell.textContent=input.value;
    await setDoc(doc(db,'metas',key),{value:input.value});
    closeModal();
  };
  opts.appendChild(save);

  addOpt('', 'blank');
  document.getElementById('modal').classList.add('active');
};

window.openModal=(user,type,day,month,cell)=>{
  currentContext={user,type,day,month,cell};
  const opts=document.getElementById('modal-options');
  opts.innerHTML='';
  document.getElementById('modal-title').textContent=`${day} de ${monthsFull[month]}`;

  const config = CALENDARS[type];
  config.options.forEach(opt => addOpt(opt.label, opt.class, opt.emoji));
  addOpt('', 'blank');

  document.getElementById('modal').classList.add('active');
};

function addOpt(label,cls,emoji){
  const b=document.createElement('button');
  if(cls==='blank') b.className='blank';
  b.textContent = label || 'Vaciar';

  b.onclick=async()=>{
    const {user,type,day,month,cell} = currentContext;
    const key = `${user}_${type}_${day}_${month}`;

    if(cls==='blank'){
      cell.textContent='';
      cell.className='calendar-cell';
      await deleteDoc(doc(db,'metas',key));
      closeModal();
      return;
    }

    cell.textContent = emoji;
    cell.className = 'calendar-cell '+cls;
    await setDoc(doc(db,'metas',key),{ class: cls, emoji });
    closeModal();
  };

  document.getElementById('modal-options').appendChild(b);
}

window.closeModal=()=>document.getElementById('modal').classList.remove('active');
</script>
</body>
</html>
