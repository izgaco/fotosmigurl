<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mis metas 2026</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 20px;
    }

    h1 {
        text-align: center;
    }

    table {
        border-collapse: collapse;
        width: 100%;
        max-width: 1200px;
        margin: auto;
        background: white;
    }

    th, td {
        border: 1px solid #ccc;
        text-align: center;
        padding: 6px;
        font-size: 14px;
        cursor: pointer;
    }

    th {
        background: #eee;
        cursor: default;
    }

    td.disabled {
        background: #f0f0f0;
        cursor: not-allowed;
    }

    /* Estados */
    .bad { background: #f28b82; }
    .normal { background: #fbbc04; }
    .good { background: #a7ffeb; }
    .great { background: #81c995; }

    /* Modal */
    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        justify-content: center;
        align-items: center;
    }

    .modal-content {
        background: white;
        padding: 20px;
        border-radius: 8px;
        text-align: center;
        width: 300px;
    }

    .modal-content button {
        width: 100%;
        margin: 5px 0;
        padding: 10px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
    }

    .btn-bad { background: #f28b82; }
    .btn-normal { background: #fbbc04; }
    .btn-good { background: #a7ffeb; }
    .btn-great { background: #81c995; }

</style>
</head>
<body>

<h1>📆 Seguimiento anual de metas</h1>

<table id="calendar"></table>

<!-- Modal -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h3>¿Cómo fue el día?</h3>
        <button class="btn-bad" onclick="setDay('bad','😞')">Día malo 😞</button>
        <button class="btn-normal" onclick="setDay('normal','😐')">Día normal 😐</button>
        <button class="btn-good" onclick="setDay('good','🙂')">Día bueno 🙂</button>
        <button class="btn-great" onclick="setDay('great','🤩')">Día genial 🤩</button>
    </div>
</div>

<script>
const months = [
    { name: "Enero", days: 31 },
    { name: "Febrero", days: 28 },
    { name: "Marzo", days: 31 },
    { name: "Abril", days: 30 },
    { name: "Mayo", days: 31 },
    { name: "Junio", days: 30 },
    { name: "Julio", days: 31 },
    { name: "Agosto", days: 31 },
    { name: "Septiembre", days: 30 },
    { name: "Octubre", days: 31 },
    { name: "Noviembre", days: 30 },
    { name: "Diciembre", days: 31 }
];

const table = document.getElementById("calendar");
let selectedCell = null;

// Crear cabecera
let header = "<tr><th>Día</th>";
months.forEach(m => header += `<th>${m.name}</th>`);
header += "</tr>";
table.innerHTML = header;

// Crear filas
for (let day = 1; day <= 31; day++) {
    let row = `<tr><th>${day}</th>`;
    months.forEach((m, monthIndex) => {
        if (day > m.days) {
            row += `<td class="disabled"></td>`;
        } else {
            const id = `${monthIndex + 1}-${day}`;
            row += `<td onclick="openModal(this,'${id}')" data-id="${id}"></td>`;
        }
    });
    row += "</tr>";
    table.innerHTML += row;
}

// Modal
const modal = document.getElementById("modal");

function openModal(cell, id) {
    selectedCell = cell;
    modal.style.display = "flex";
}

function setDay(type, emoji) {
    if (!selectedCell) return;

    selectedCell.className = type;
    selectedCell.textContent = emoji;

    const id = selectedCell.dataset.id;
    localStorage.setItem(id, JSON.stringify({ type, emoji }));

    modal.style.display = "none";
}

// Cargar datos guardados
document.querySelectorAll("td[data-id]").forEach(cell => {
    const data = localStorage.getItem(cell.dataset.id);
    if (data) {
        const saved = JSON.parse(data);
        cell.className = saved.type;
        cell.textContent = saved.emoji;
    }
});

// Cerrar modal al hacer clic fuera
modal.addEventListener("click", e => {
    if (e.target === modal) modal.style.display = "none";
});
</script>

</body>
</html>
