<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mis metas 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 10px;
        margin: 0;
    }

    h1 {
        text-align: center;
        font-size: 1.5rem;
        margin-bottom: 10px;
    }

    .table-container {
        overflow-x: auto; /* Scroll horizontal en móviles */
    }

    table {
        border-collapse: collapse;
        width: 100%;
        min-width: 800px; /* Para escritorio */
        background: white;
    }

    th, td {
        border: 1px solid #ccc;
        text-align: center;
        padding: 8px;
        font-size: 12px;
        cursor: pointer;
    }

    th {
        background: #eee;
        cursor: default;
        font-size: 12px;
    }

    td.disabled {
        background: #f0f0f0;
        cursor: not-allowed;
    }

    /* Estados */
    .bad { background: #f28b82; }
    .normal { background: #fbbc04; }
    .good { background: #a7ffeb; }
    .great { background: #81c995; }

    /* Modal */
    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        justify-content: center;
        align-items: center;
        z-index: 100;
    }

    .modal-content {
        background: white;
        padding: 20px;
        border-radius: 8px;
        text-align: center;
        width: 90%;
        max-width: 300px;
    }

    .modal-content h3 {
        font-size: 1.2rem;
        margin-bottom: 15px;
    }

    .modal-content button {
        width: 100%;
        margin: 5px 0;
        padding: 15px;
        font-size: 1rem;
        cursor: pointer;
        border: none;
        border-radius: 5px;
    }

    .btn-bad { background: #f28b82; }
    .btn-normal { background: #fbbc04; }
    .btn-good { background: #a7ffeb; }
    .btn-great { background: #81c995; }

    /* Media query para escritorio */
    @media (min-width: 768px) {
        h1 { font-size: 2rem; }
        th, td { font-size: 14px; padding: 6px; }
        .modal-content h3 { font-size: 1.4rem; }
        .modal-content button { font-size: 1.1rem; padding: 12px; }
    }
</style>
</head>
<body>

<h1>📆 Seguimiento anual de metas</h1>

<div class="table-container">
    <table id="calendar"></table>
</div>

<!-- Modal -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h3>¿Cómo fue el día?</h3>
        <button class="btn-bad" onclick="setDay('bad','😞')">Día malo 😞</button>
        <button class="btn-normal" onclick="setDay('normal','😐')">Día normal 😐</button>
        <button class="btn-good" onclick="setDay('good','🙂')">Día bueno 🙂</button>
        <button class="btn-great" onclick="setDay('great','🤩')">Día genial 🤩</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "PEGA_AQUÍ_TU_APIKEY",
  authDomain: "PEGA_AQUÍ",
  projectId: "PEGA_AQUÍ",
  storageBucket: "PEGA_AQUÍ",
  messagingSenderId: "PEGA_AQUÍ",
  appId: "PEGA_AQUÍ"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const months = [
    { name: "Enero", days: 31 },
    { name: "Febrero", days: 28 },
    { name: "Marzo", days: 31 },
    { name: "Abril", days: 30 },
    { name: "Mayo", days: 31 },
    { name: "Junio", days: 30 },
    { name: "Julio", days: 31 },
    { name: "Agosto", days: 31 },
    { name: "Septiembre", days: 30 },
    { name: "Octubre", days: 31 },
    { name: "Noviembre", days: 30 },
    { name: "Diciembre", days: 31 }
];

const table = document.getElementById("calendar");
let selectedCell = null;

// Crear cabecera
let header = "<tr><th>Día</th>";
months.forEach(m => header += `<th>${m.name}</th>`);
header += "</tr>";
table.innerHTML = header;

// Crear filas
for (let day = 1; day <= 31; day++) {
    let row = `<tr><th>${day}</th>`;
    months.forEach((m, monthIndex) => {
        if (day > m.days) {
            row += `<td class="disabled"></td>`;
        } else {
            const id = `${monthIndex + 1}-${day}`;
            row += `<td onclick="openModal(this,'${id}')" data-id="${id}"></td>`;
        }
    });
    row += "</tr>";
    table.innerHTML += row;
}

// Modal
const modal = document.getElementById("modal");

function openModal(cell, id) {
    selectedCell = cell;
    modal.style.display = "flex";
}

function setDay(type, emoji) {
    if (!selectedCell) return;

    selectedCell.className = type;
    selectedCell.textContent = emoji;

    const id = selectedCell.dataset.id;

    db.collection("days").doc(id).set({
        type: type,
        emoji: emoji
    });

    modal.style.display = "none";
}

// Cargar datos guardados
db.collection("days").onSnapshot(snapshot => {
    snapshot.forEach(doc => {
        const cell = document.querySelector(`td[data-id="${doc.id}"]`);
        if (cell) {
            cell.className = doc.data().type;
            cell.textContent = doc.data().emoji;
        }
    });
});

// Cerrar modal al hacer clic fuera
modal.addEventListener("click", e => {
    if (e.target === modal) modal.style.display = "none";
});
</script>

</body>
</html>
