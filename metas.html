<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Metas 2026</title>

<style>
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --primary: #4f46e5;
  --text: #1f2937;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.screen { display: none; padding: 16px; }
.screen.active { display: block; }

h2 { margin-top: 0; }

button {
  border: none;
  padding: 14px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  background: var(--primary);
  color: white;
}

button.secondary {
  background: #e5e7eb;
  color: #111;
}

.user-select {
  display: grid;
  gap: 16px;
  margin-top: 40px;
}

.menu {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}

.menu button { flex: 1; }

/* ===== GRID VISUAL MEJORADA ===== */
.calendar-grid {
  display: grid;
  grid-template-columns: 42px repeat(12, 1fr);
  gap: 4px;
  font-size: 11px;
  margin-top: 12px;
}

.calendar-cell {
  background: #ffffff;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  cursor: pointer;
  user-select: none;
}

.calendar-cell.header {
  font-weight: 700;
  background: #eef2ff;
  cursor: default;
}

.calendar-cell.day {
  font-weight: 700;
  background: #f1f5f9;
  cursor: default;
}

.calendar-cell:hover { filter: brightness(0.95); }

.calendar-cell.bad    { background: #fecaca; }
.calendar-cell.normal { background: #fde68a; }
.calendar-cell.good   { background: #bbf7d0; }
.calendar-cell.great  { background: #bfdbfe; }

/* ===== MODAL ===== */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

.modal.active { display: flex; }

.modal-box {
  background: white;
  width: 90%;
  max-width: 320px;
  padding: 20px;
  border-radius: 16px;
}

.modal-box h3 { margin-top: 0; }
.modal-box button { width: 100%; margin-top: 10px; }
</style>
</head>

<body>

<!-- SELECCIÓN USUARIO -->
<div id="screen-user" class="screen active">
  <h2>¿Quién hace el seguimiento?</h2>
  <div class="user-select">
    <button onclick="selectUser('Izhar')">Izhar</button>
    <button onclick="selectUser('Camila')">Camila</button>
  </div>
</div>

<!-- IZHAR -->
<div id="screen-izhar" class="screen">
  <h2>Izhar · Metas 2026</h2>
  <div id="izhar-biblia"></div>
</div>

<!-- CAMILA -->
<div id="screen-camila" class="screen">
  <h2>Camila · Metas 2026</h2>
  <div class="menu">
    <button onclick="showSection('biblia')">Biblia</button>
    <button onclick="showSection('emocional')">Año emocional</button>
    <button onclick="showSection('agua')">Beber agua</button>
  </div>

  <div id="camila-biblia"></div>
  <div id="camila-emocional" style="display:none"></div>
  <div id="camila-agua" style="display:none"></div>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modal-title">Selecciona</h3>
    <div id="modal-options"></div>
    <button class="secondary" onclick="closeModal()">Cancelar</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCBSbcwyQCz7p5tYHhv0yQT-Q_Mn4M8dro",
  authDomain: "migurl-metas.firebaseapp.com",
  projectId: "migurl-metas"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const months = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
let currentContext = null;

window.selectUser = (user) => {
  document.getElementById('screen-user').classList.remove('active');
  document.getElementById(user === 'Izhar' ? 'screen-izhar' : 'screen-camila').classList.add('active');

  if (user === 'Izhar') {
    renderCalendar('Izhar','biblia',document.getElementById('izhar-biblia'));
  } else {
    renderCalendar('Camila','biblia',document.getElementById('camila-biblia'));
    renderCalendar('Camila','emocional',document.getElementById('camila-emocional'));
    renderCalendar('Camila','agua',document.getElementById('camila-agua'));
  }
};

window.showSection = (section) => {
  ['biblia','emocional','agua'].forEach(s=>{
    const el=document.getElementById(`camila-${s}`);
    if(el) el.style.display = s===section?'block':'none';
  });
};

function renderCalendar(user,type,container){
  container.innerHTML='';
  const grid=document.createElement('div');
  grid.className='calendar-grid';

  grid.appendChild(document.createElement('div'));
  months.forEach(m=>{
    const c=document.createElement('div');
    c.className='calendar-cell header';
    c.textContent=m;
    grid.appendChild(c);
  });

  for(let d=1;d<=31;d++){
    const day=document.createElement('div');
    day.className='calendar-cell day';
    day.textContent=d;
    grid.appendChild(day);

    months.forEach((_,mi)=>{
      const cell=document.createElement('div');
      cell.className='calendar-cell';
      cell.onclick=()=>openModal(user,type,d,mi,cell);
      grid.appendChild(cell);
      loadCell(user,type,d,mi,cell);
    });
  }
  container.appendChild(grid);
}

async function loadCell(user,type,day,month,cell){
  const ref=doc(db,'metas',`${user}_${type}_${day}_${month}`);
  const snap=await getDoc(ref);
  if(snap.exists()){
    const v=snap.data();
    cell.textContent=v.label||'';
    cell.classList.add(v.class||'');
  }
}

window.openModal=(user,type,day,month,cell)=>{
  currentContext={user,type,day,month,cell};
  const opts=document.getElementById('modal-options');
  opts.innerHTML='';

  document.getElementById('modal-title').textContent =
    type==='agua'?'Vasos de agua':type==='emocional'?'Estado del día':'Hecho';

  if(type==='emocional'){
    addOpt('😞','bad'); addOpt('😐','normal'); addOpt('🙂','good'); addOpt('🤩','great');
  } else if(type==='agua'){
    addOpt('💧',''); addOpt('💧💧',''); addOpt('💧💧💧',''); addOpt('💧💧💧💧','');
  } else {
    addOpt('✔','good'); addOpt('','');
  }
  document.getElementById('modal').classList.add('active');
};

function addOpt(label,cls){
  const b=document.createElement('button');
  b.textContent=label||'Vacío';
  b.onclick=()=>saveOpt(label,cls);
  document.getElementById('modal-options').appendChild(b);
}

async function saveOpt(label,cls){
  const {user,type,day,month,cell}=currentContext;
  cell.textContent=label;
  cell.className='calendar-cell '+(cls||'');
  await setDoc(doc(db,'metas',`${user}_${type}_${day}_${month}`),{label,class:cls});
  closeModal();
}

window.closeModal=()=>{
  document.getElementById('modal').classList.remove('active');
};
</script>

</body>
</html>
