<!-- FIXED VERSION restoring user selector buttons behavior --><!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Metas 2026 (fix usuarios)</title>
<style>
body{font-family:system-ui;background:#f4f6fb;margin:0;padding:0}
header{padding:1rem;text-align:center}
.user-switch{display:flex;justify-content:center;gap:.5rem;margin-bottom:1rem}
.user-switch button{padding:.5rem 1rem;border-radius:999px;border:0;cursor:pointer;background:#dbe4ff}
.user-switch button.active{background:#4c6ef5;color:#fff}
.calendar{margin:1rem}
.calendar h3{text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calendar-cell{aspect-ratio:1;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer}
.tick{background:#c3fae8}
.cross{background:#ffe3e3}
.water{background:#d0ebff}
.emotion-good{background:#e6fcf5}
.emotion-bad{background:#fff5f5}
.exercise{background:#f1f3f5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center}
.modal-content{background:#fff;padding:1rem;border-radius:12px;display:flex;flex-direction:column;gap:.5rem}
.modal-content button{padding:.5rem;border-radius:8px;border:0;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="user-switch">
    <button id="btn-izhar" class="active">Izhar</button>
    <button id="btn-camila">Camila</button>
  </div>
</header>
<div id="app"></div>
<div class="modal" id="modal"><div class="modal-content" id="modalContent"></div></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
import { getFirestore, doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js';
const firebaseConfig={apiKey:"demo",authDomain:"demo",projectId:"demo"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
let currentUser='izhar';
const USERS={izhar:['biblia','ejercicio'],camila:['emocional','agua','skincare']};
const CALENDARS={
  biblia:{title:'Lectura Biblia',options:[{label:'Leído',class:'tick',emoji:'✅'},{label:'No',class:'cross',emoji:'❌'}]},
  ejercicio:{title:'Ejercicio',options:[{label:'Hecho',class:'exercise',emoji:'💪'}]},
  emocional:{title:'Año emocional',options:[{label:'Bien',class:'emotion-good',emoji:'😊'},{label:'Mal',class:'emotion-bad',emoji:'😞'}]},
  agua:{title:'Beber agua',options:[{label:'Agua',class:'water',emoji:'💧'}]},
  skincare:{title:'Skincare',options:[{label:'Rutina',class:'water',emoji:'🧴'}]}
};
const appDiv=document.getElementById('app');
const modal=document.getElementById('modal');const modalContent=document.getElementById('modalContent');
function render(){
  appDiv.innerHTML='';
  USERS[currentUser].forEach(type=>renderCalendar(type));
}
function renderCalendar(type){
  const cal=CALENDARS[type];
  const wrap=document.createElement('div');wrap.className='calendar';
  wrap.innerHTML=`<h3>${cal.title}</h3><div class="grid"></div>`;
  const grid=wrap.querySelector('.grid');
  for(let d=1;d<=30;d++){
    const cell=document.createElement('div');cell.className='calendar-cell';cell.textContent='';
    cell.onclick=()=>openModal(cell,type,d);
    grid.appendChild(cell);
    loadCell(cell,type,d);
  }
  appDiv.appendChild(wrap);
}
function openModal(cell,type,day){
  modalContent.innerHTML='';
  CALENDARS[type].options.forEach(o=>{
    const b=document.createElement('button');b.textContent=o.label+' '+o.emoji;
    b.onclick=()=>addOpt(cell,type,day,o);
    modalContent.appendChild(b);
  });
  modal.style.display='flex';
}
function addOpt(cell,type,day,opt){
  cell.className='calendar-cell';
  if(opt.class)cell.classList.add(opt.class);
  cell.textContent=opt.emoji||'';
  const key=`${currentUser}_${type}_${day}`;
  setDoc(doc(db,'metas2',key),{class:opt.class||'',emoji:opt.emoji||''});
  modal.style.display='none';
}
async function loadCell(cell,type,day){
  const key=`${currentUser}_${type}_${day}`;
  const snap=await getDoc(doc(db,'metas2',key));
  if(snap.exists()){
    const v=snap.data();
    cell.className='calendar-cell';
    if(v.class)cell.classList.add(v.class);
    cell.textContent=v.emoji||'';
  }
}
document.getElementById('btn-izhar').onclick=()=>switchUser('izhar');
document.getElementById('btn-camila').onclick=()=>switchUser('camila');
function switchUser(u){
  currentUser=u;
  document.getElementById('btn-izhar').classList.toggle('active',u==='izhar');
  document.getElementById('btn-camila').classList.toggle('active',u==='camila');
  render();
}
render();
</script>
</body>
</html>
