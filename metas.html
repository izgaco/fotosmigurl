<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metas 2026</title>

<style>
/* =========================
   RESET + BASE
========================= */
* {
  box-sizing: border-box;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 0;
  background: #f4f6f8;
  color: #222;
}

/* =========================
   LAYOUT
========================= */
.app {
  max-width: 480px;
  margin: 0 auto;
  padding: 16px;
}

.card {
  background: #fff;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 4px 12px rgba(0,0,0,.06);
}

h1 {
  font-size: 22px;
  text-align: center;
  margin-bottom: 16px;
}

h2 {
  font-size: 18px;
  margin-bottom: 12px;
  text-align: center;
}

/* =========================
   CONTROLES
========================= */
label {
  font-weight: 600;
  font-size: 14px;
  display: block;
  margin-bottom: 6px;
}

select {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #ddd;
  font-size: 16px;
  background: #fafafa;
}

.menu-buttons button {
  width: 100%;
  padding: 14px;
  margin-bottom: 10px;
  font-size: 16px;
  border-radius: 14px;
  border: none;
  background: #1976d2;
  color: white;
  font-weight: 600;
}

/* =========================
   TABLA
========================= */
.table-wrapper {
  overflow-x: auto;
}

table {
  border-collapse: collapse;
  width: 100%;
  font-size: 11px;
}

th, td {
  border: 1px solid #e0e0e0;
  text-align: center;
  padding: 6px;
  min-width: 28px;
}

th {
  background: #fafafa;
  font-weight: 600;
}

td {
  height: 34px;
  cursor: pointer;
  border-radius: 6px;
}

/* Estados emocionales */
.malo { background:#f44336; color:white; }
.normal { background:#ffc107; }
.bueno { background:#4caf50; color:white; }
.genial { background:#2196f3; color:white; }

/* Agua */
.vasos2 { background:#c8e6c9; }
.vasos4 { background:#81c784; color:white; }
.vasos6 { background:#4caf50; color:white; }
.vasos8 { background:#2e7d32; color:white; }

/* =========================
   MODAL PERFECTAMENTE CENTRADO
========================= */
#modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

.modal-box {
  background: white;
  width: 90%;
  max-width: 320px;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,.2);
  animation: pop .15s ease-out;
}

@keyframes pop {
  from { transform: scale(.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.modal-box button {
  width: 100%;
  padding: 14px;
  margin-bottom: 10px;
  font-size: 16px;
  border-radius: 14px;
  border: none;
  font-weight: 600;
}

.btn-malo { background:#f44336; color:white; }
.btn-normal { background:#ffc107; }
.btn-bueno { background:#4caf50; color:white; }
.btn-genial { background:#2196f3; color:white; }
.btn-blank { background:#e0e0e0; }

.hidden { display:none; }

/* =========================
   DESKTOP
========================= */
@media (min-width: 768px) {
  .app { max-width: 900px; }
  table { font-size: 13px; }
}
</style>
</head>

<body>

<div class="app">

  <h1>Metas 2026</h1>

  <div class="card">
    <label>¿Quién hace el seguimiento?</label>
    <select id="user" onchange="selectUser()">
      <option value="">Selecciona persona</option>
      <option value="Izhar">Izhar</option>
      <option value="Camila">Camila</option>
    </select>
  </div>

  <div id="camila-menu" class="card hidden">
    <h2>Camila</h2>
    <div class="menu-buttons">
      <button onclick="showGrid('agua')">💧 Beber agua</button>
      <button onclick="showGrid('emocional')">🗓️ Año emocional</button>
    </div>
  </div>

  <div id="grid-container"></div>

</div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box" id="modal-content"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCBSbcwyQCz7p5tYHhv0yQT-Q_Mn4M8dro",
  authDomain: "migurl-metas.firebaseapp.com",
  projectId: "migurl-metas"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const months = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
const daysInMonth = [31,29,31,30,31,30,31,31,30,31,30,31];

let currentUser = "";
let currentType = "";
let selectedCell = null;

function selectUser() {
  currentUser = user.value;
  grid-container.innerHTML = "";
  camila-menu.classList.toggle("hidden", currentUser !== "Camila");
  if (currentUser === "Izhar") showGrid("emocional");
}

function showGrid(type) {
  currentType = type;
  const container = document.getElementById("grid-container");
  container.innerHTML = "";

  const card = document.createElement("div");
  card.className = "card table-wrapper";

  const table = document.createElement("table");
  table.innerHTML = "<tr><th>Día</th>" + months.map(m=>`<th>${m}</th>`).join("") + "</tr>";

  for (let d=1; d<=31; d++) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<th>${d}</th>`;
    for (let m=0; m<12; m++) {
      const td = document.createElement("td");
      if (d <= daysInMonth[m]) {
        td.dataset.id = `${currentUser}-${type}-${d}-${m+1}`;
        td.onclick = () => openModal(td);
      }
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }

  card.appendChild(table);
  container.appendChild(card);
  loadDays();
}

function openModal(td) {
  selectedCell = td;
  const modal = document.getElementById("modal");
  const c = document.getElementById("modal-content");

  c.innerHTML = currentType === "agua" ? `
    <button class="btn-bueno" onclick="setDay('vasos2')">2 vasos 💧</button>
    <button class="btn-bueno" onclick="setDay('vasos4')">4 vasos 💧</button>
    <button class="btn-bueno" onclick="setDay('vasos6')">6 vasos 💧</button>
    <button class="btn-bueno" onclick="setDay('vasos8')">8 vasos 💧</button>
    <button class="btn-blank" onclick="setDay('')">En blanco</button>
  ` : `
    <button class="btn-malo" onclick="setDay('malo')">😞 Día malo</button>
    <button class="btn-normal" onclick="setDay('normal')">😐 Día normal</button>
    <button class="btn-bueno" onclick="setDay('bueno')">🙂 Día bueno</button>
    <button class="btn-genial" onclick="setDay('genial')">🤩 Día genial</button>
    <button class="btn-blank" onclick="setDay('')">En blanco</button>
  `;

  modal.style.display = "flex";
}

modal.onclick = e => { if (e.target.id === "modal") modal.style.display = "none"; }

function setDay(val) {
  selectedCell.className = "";
  selectedCell.textContent = "";
  if (val) {
    selectedCell.classList.add(val);
    selectedCell.textContent = val.startsWith("vasos") ? val.replace("vasos","")+"💧" :
      val==="malo"?"😞":val==="normal"?"😐":val==="bueno"?"🙂":"🤩";
  }
  db.collection("days").doc(selectedCell.dataset.id).set({ value: val });
  modal.style.display = "none";
}

function loadDays() {
  db.collection("days").get().then(snap=>{
    snap.forEach(doc=>{
      const cell = document.querySelector(`[data-id="${doc.id}"]`);
      if (!cell) return;
      const v = doc.data().value;
      if (v) {
        cell.classList.add(v);
        cell.textContent = v.startsWith("vasos") ? v.replace("vasos","")+"💧" :
          v==="malo"?"😞":v==="normal"?"😐":v==="bueno"?"🙂":"🤩";
      }
    });
  });
}
</script>

</body>
</html>
