<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metas 2026</title>

<style>
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --primary: #4f46e5;
  --text: #1f2937;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* ---------- PANTALLAS ---------- */
.screen {
  display: none;
  padding: 16px;
}

.screen.active {
  display: block;
}

/* ---------- BOTONES ---------- */
button {
  border: none;
  padding: 14px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  background: var(--primary);
  color: white;
}

button.secondary {
  background: #e5e7eb;
  color: #111;
}

/* ---------- SELECCIÓN USUARIO ---------- */
.user-select {
  display: grid;
  gap: 16px;
  margin-top: 40px;
}

/* ---------- MENÚ ---------- */
.menu {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}

.menu button {
  flex: 1;
}

/* ---------- CUADRÍCULAS ---------- */
.grid {
  display: grid;
  grid-template-columns: 40px repeat(12, 1fr);
  gap: 2px;
  font-size: 11px;
}

.cell {
  background: var(--card);
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
}

.day {
  font-weight: bold;
}

.clickable {
  cursor: pointer;
}

/* ---------- MODAL ---------- */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

.modal.active {
  display: flex;
}

.modal-box {
  background: white;
  width: 90%;
  max-width: 320px;
  padding: 20px;
  border-radius: 16px;
}

.modal-box h3 {
  margin-top: 0;
}

.modal-box button {
  width: 100%;
  margin-top: 10px;
}

/* ---------- COLORES ---------- */
.bad { background:#fecaca; }
.normal { background:#fde68a; }
.good { background:#bbf7d0; }
.great { background:#bfdbfe; }
</style>
</head>

<body>

<!-- PANTALLA USUARIO -->
<div id="screen-user" class="screen active">
  <h2>¿Quién hace el seguimiento?</h2>
  <div class="user-select">
    <button onclick="selectUser('Izhar')">Izhar</button>
    <button onclick="selectUser('Camila')">Camila</button>
  </div>
</div>

<!-- PANTALLA CAMILA -->
<div id="screen-camila" class="screen">
  <h2>Camila · Metas 2026</h2>

  <div class="menu">
    <button onclick="showSection('emocional')">Año emocional</button>
    <button onclick="showSection('agua')">Beber agua</button>
  </div>

  <div id="section-emocional"></div>
  <div id="section-agua" style="display:none"></div>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3>Selecciona estado</h3>
    <button onclick="saveValue('bad','😞')">Día malo</button>
    <button onclick="saveValue('normal','😐')">Día normal</button>
    <button onclick="saveValue('good','🙂')">Día bueno</button>
    <button onclick="saveValue('great','🤩')">Día genial</button>
    <button class="secondary" onclick="saveValue('','')">Dejar en blanco</button>
  </div>
</div>

<!-- FIREBASE + APP -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCBSbcwyQCz7p5tYHhv0yQT-Q_Mn4M8dro",
  authDomain: "migurl-metas.firebaseapp.com",
  projectId: "migurl-metas"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const months = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
let currentCell = null;

window.selectUser = (user) => {
  document.getElementById("screen-user").classList.remove("active");
  document.getElementById("screen-camila").classList.add("active");
  renderGrid("section-emocional");
};

window.showSection = (section) => {
  document.getElementById("section-emocional").style.display = section==="emocional"?"block":"none";
  document.getElementById("section-agua").style.display = section==="agua"?"block":"none";
};

function renderGrid(containerId) {
  const c = document.getElementById(containerId);
  c.innerHTML = "";
  const grid = document.createElement("div");
  grid.className = "grid";

  grid.appendChild(document.createElement("div"));
  months.forEach(m => {
    const d = document.createElement("div");
    d.className="cell";
    d.textContent=m;
    grid.appendChild(d);
  });

  for(let d=1; d<=31; d++){
    const day = document.createElement("div");
    day.className="cell day";
    day.textContent=d;
    grid.appendChild(day);

    months.forEach(m=>{
      const cell = document.createElement("div");
      cell.className="cell clickable";
      cell.onclick = () => openModal(cell);
      grid.appendChild(cell);
    });
  }

  c.appendChild(grid);
}

window.openModal = (cell) => {
  currentCell = cell;
  document.getElementById("modal").classList.add("active");
};

window.saveValue = async (cls, emoji) => {
  currentCell.className = "cell clickable " + cls;
  currentCell.textContent = emoji;
  document.getElementById("modal").classList.remove("active");

  await setDoc(doc(db,"test","ejemplo"),{updated:Date.now()});
};
</script>

</body>
</html>
