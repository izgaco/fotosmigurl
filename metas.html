<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metas 2026</title>

<style>
/* ===== BASE ===== */
body{
  font-family: system-ui, sans-serif;
  margin:0;
  padding:12px;
  background: linear-gradient(180deg,#eef2f7,#f9fafb);
}

h1{
  text-align:center;
  margin-bottom:10px;
}

/* ===== SELECT ===== */
.select-card{
  background:white;
  padding:15px;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.08);
  max-width:320px;
  margin:0 auto 15px;
}

select{
  width:100%;
  padding:12px;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ccc;
}

/* ===== PANEL MENU ===== */
.menu{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.menu button{
  background:white;
  border:none;
  border-radius:14px;
  padding:14px;
  min-width:140px;
  font-size:15px;
  box-shadow:0 6px 16px rgba(0,0,0,.1);
  cursor:pointer;
}

/* ===== CALENDAR ===== */
.card{
  background:white;
  border-radius:16px;
  padding:10px;
  box-shadow:0 10px 24px rgba(0,0,0,.1);
}

.table-container{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  font-size:11px;
}

th,td{
  border:1px solid #ddd;
  text-align:center;
  padding:2px;
  min-width:22px;
}

td{
  height:26px;
  cursor:pointer;
  font-size:15px;
}

/* ===== STATES ===== */
.malo{background:#f44336;color:white;}
.normal{background:#ffc107;}
.bueno{background:#4caf50;color:white;}
.genial{background:#2196f3;color:white;}

.vasos2,.vasos4,.vasos6,.vasos8{
  background:#4caf50;color:white;
}

.ok{background:#4caf50;color:white;}
.no{background:#f44336;color:white;}

/* ===== MODAL ===== */
#modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
}

#modal-content{
  background:white;
  padding:16px;
  border-radius:16px;
  width:90%;
  max-width:300px;
}

.modal-btn{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:10px;
  font-size:16px;
}
</style>
</head>

<body>

<h1>Metas 2026</h1>

<div class="select-card">
  <select id="userSelect">
    <option value="">Usuario</option>
  </select>
</div>

<div id="panelMenu" class="menu"></div>

<div class="card table-container">
  <div id="grid"></div>
</div>

<div id="modal">
  <div id="modal-content"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCBSbcwyQCz7p5tYHhv0yQT-Q_Mn4M8dro",
  authDomain:"migurl-metas.firebaseapp.com",
  projectId:"migurl-metas"
});
const db=firebase.firestore();

const USERS={
  Izhar:["lectura"],
  Camila:["emocional","agua"]
};

const PANELS={
  emocional:{label:"Año emocional 🧠"},
  agua:{label:"Beber agua 💧"},
  lectura:{label:"Lectura Biblia 📖"}
};

const months=["E","F","M","A","M","J","J","A","S","O","N","D"];
const daysInMonth=[31,29,31,30,31,30,31,31,30,31,30,31];

let currentUser="",currentPanel="",selectedCell=null;

const userSelect=document.getElementById("userSelect");
Object.keys(USERS).forEach(u=>{
  userSelect.innerHTML+=`<option>${u}</option>`;
});

userSelect.onchange=()=>{
  currentUser=userSelect.value;
  document.getElementById("grid").innerHTML="";
  document.getElementById("panelMenu").innerHTML="";
  if(!currentUser) return;

  USERS[currentUser].forEach(p=>{
    const b=document.createElement("button");
    b.textContent=PANELS[p].label;
    b.onclick=()=>showGrid(p);
    document.getElementById("panelMenu").appendChild(b);
  });
};

function showGrid(panel){
  currentPanel=panel;
  const grid=document.getElementById("grid");
  grid.innerHTML="";

  const table=document.createElement("table");
  table.innerHTML=`<tr><th></th>${months.map(m=>`<th>${m}</th>`).join("")}</tr>`;

  for(let d=1;d<=31;d++){
    const tr=document.createElement("tr");
    tr.innerHTML=`<th>${d}</th>`;
    for(let m=0;m<12;m++){
      const td=document.createElement("td");
      if(d<=daysInMonth[m]){
        td.dataset.id=`${currentUser}-${panel}-${d}-${m+1}`;
        td.onclick=()=>openModal(td);
      }
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }
  grid.appendChild(table);
  loadDays();
}

function applyValue(cell,v){
  cell.className="";
  cell.textContent="";
  if(!v) return;

  cell.classList.add(v);
  if(v.startsWith("vasos")) cell.textContent="💧";
  else if(v==="malo") cell.textContent="😞";
  else if(v==="normal") cell.textContent="😐";
  else if(v==="bueno") cell.textContent="🙂";
  else if(v==="genial") cell.textContent="🤩";
  else if(v==="ok") cell.textContent="✔️";
  else if(v==="no") cell.textContent="❌";
}

function openModal(td){
  selectedCell=td;
  const c=document.getElementById("modal-content");
  if(currentPanel==="lectura"){
    c.innerHTML=`
      <button class="modal-btn" onclick="setDay('ok')">✔️ Leído</button>
      <button class="modal-btn" onclick="setDay('no')">❌ No leído</button>
      <button class="modal-btn" onclick="setDay('')">⬜ En blanco</button>`;
  }else if(currentPanel==="agua"){
    c.innerHTML=[2,4,6,8].map(v=>
      `<button class="modal-btn" onclick="setDay('vasos${v}')">${v} vasos 💧</button>`
    ).join("")+`<button class="modal-btn" onclick="setDay('')">⬜</button>`;
  }else{
    c.innerHTML=`
      <button class="modal-btn" onclick="setDay('malo')">😞</button>
      <button class="modal-btn" onclick="setDay('normal')">😐</button>
      <button class="modal-btn" onclick="setDay('bueno')">🙂</button>
      <button class="modal-btn" onclick="setDay('genial')">🤩</button>
      <button class="modal-btn" onclick="setDay('')">⬜</button>`;
  }
  document.getElementById("modal").style.display="flex";
}

function setDay(v){
  applyValue(selectedCell,v);
  db.collection("days").doc(selectedCell.dataset.id).set({value:v});
  document.getElementById("modal").style.display="none";
}

function loadDays(){
  db.collection("days").get().then(s=>{
    s.forEach(d=>{
      const cell=document.querySelector(`[data-id="${d.id}"]`);
      if(cell) applyValue(cell,d.data().value);
    });
  });
}

document.getElementById("modal").onclick=e=>{
  if(e.target.id==="modal") e.target.style.display="none";
};
</script>
</body>
</html>
