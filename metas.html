<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Metas 2026</title>

<style>
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --primary: #4f46e5;
  --primary-light: #a5b4fc;
  --water-2: #dbeafe;
  --water-4: #bfdbfe;
  --water-6: #60a5fa;
  --water-8: #4f46e5;
  --exercise-strength: #fecaca;
  --exercise-cardio: #fde68a;
  --exercise-rest: #bbf7d0;
  --tick-green: #bbf7d0;
  --cross-red: #fecaca;
  --emotional-bad: #f87171;
  --emotional-normal: #86efac;
  --emotional-good: #4ade80;
  --emotional-great: #16a34a;
  --skincare-journal: #bbf7d0;
  --skincare-skin: #16a34a;
  --skincare-both: #93c5fd;
  --reading-0: #f87171;
  --reading-10: #86efac;
  --reading-20: #4ade80;
  --reading-30: #16a34a;
  --blank-gray: #e5e7eb;
  --text: #1f2937;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
.screen { display: none; padding: 16px; }
.screen.active { display: block; }
h2 { margin-top: 0; text-align: center; }
button { border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; background: var(--primary-light); color: #111; }
button.active { background: var(--primary); color: #fff; }
button.secondary { background: #e5e7eb; color: #111; }
.user-select { display: grid; gap: 16px; margin-top: 40px; }
.menu { display: flex; justify-content: center; margin-bottom: 16px; }
.menu select { width: 100%; max-width: 320px; padding: 14px; border-radius: 14px; border: none; font-size: 16px; font-weight: 600; background: var(--primary-light); color: #111; appearance: none; text-align: center; }
.calendar-grid { display: grid; grid-template-columns: 20px repeat(12, 1fr); gap: 2px; font-size: 10px; margin-top: 8px; }
.calendar-cell { background: #ffffff; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer; user-select: none; }
.calendar-cell.header { font-weight: 700; background: #eef2ff; cursor: default; }
.calendar-cell.day { font-weight: 700; background: #f1f5f9; cursor: default; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 10; }
.modal.active { display: flex; }
.modal-box { background: white; width: 90%; max-width: 320px; padding: 20px; border-radius: 16px; }
.modal-box h3 { margin-top: 0; }
.modal-box button { width: 100%; margin-top: 10px; }
.modal-box button.blank { background: var(--blank-gray); color: #111; }
</style>
</head>
<body>

<div id="screen-user" class="screen active">
  <h2>¿Quién hace el seguimiento?</h2>
  <div class="user-select">
    <button onclick="selectUser('Izhar')">Izhar</button>
    <button onclick="selectUser('Camila')">Camila</button>
  </div>
</div>

<div id="screen-izhar" class="screen">
  <button class="secondary" onclick="volverUsuario()">Volver</button>
  <h2>Izhar · Metas 2026</h2>
  <div class="menu">
    <select id="select-izhar" onchange="showIzharSection(this.value)">
      <option value="biblia">📖 Lectura de la Biblia</option>
      <option value="ejercicio">💪 Ejercicio</option>
    </select>
  </div>
  <div id="izhar-biblia"></div>
  <div id="izhar-ejercicio" style="display:none"></div>
</div>

<div id="screen-camila" class="screen">
  <button class="secondary" onclick="volverUsuario()">Volver</button>
  <h2>Camila · Metas 2026</h2>
  <div class="menu">
    <select id="select-camila" onchange="showSection(this.value)">
      <option value="emocional">💭 Año emocional</option>
      <option value="agua">💧 Beber agua</option>
      <option value="skincare">🧴 Skincare</option>
      <option value="lectura">📚 Lectura</option>
    </select>
  </div>
  <div id="camila-emocional"></div>
  <div id="camila-agua" style="display:none"></div>
  <div id="camila-skincare" style="display:none"></div>
  <div id="camila-lectura" style="display:none"></div>
</div>

<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modal-title">Selecciona</h3>
    <div id="modal-options"></div>
    <button class="secondary" onclick="closeModal()">Cancelar</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCBSbcwyQCz7p5tYHhv0yQT-Q_Mn4M8dro", authDomain: "migurl-metas.firebaseapp.com", projectId: "migurl-metas" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const monthsFull = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const monthsShort = monthsFull.map(m => m.slice(0,3).toUpperCase());
let currentContext = null;
const cellLocks = {};

window.volverUsuario = () => { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById('screen-user').classList.add('active'); };
window.selectUser = (user) => {
  document.getElementById('screen-user').classList.remove('active');
  document.getElementById(user==='Izhar'?'screen-izhar':'screen-camila').classList.add('active');
  if(user==='Izhar'){
    renderCalendar('Izhar','biblia',document.getElementById('izhar-biblia'));
    renderCalendar('Izhar','ejercicio',document.getElementById('izhar-ejercicio'));
  } else {
    renderCalendar('Camila','emocional',document.getElementById('camila-emocional'));
    renderCalendar('Camila','agua',document.getElementById('camila-agua'));
    renderCalendar('Camila','skincare',document.getElementById('camila-skincare'));
    renderCalendar('Camila','lectura',document.getElementById('camila-lectura'));
  }
};
window.showIzharSection = (section) => { document.getElementById('izhar-biblia').style.display = section==='biblia'?'block':'none'; document.getElementById('izhar-ejercicio').style.display = section==='ejercicio'?'block':'none'; };
window.showSection = (section) => { ['emocional','agua','skincare','lectura'].forEach(s=>{ const el=document.getElementById('camila-'+s); if(el) el.style.display=s===section?'block':'none'; }); };

function renderCalendar(user,type,container){
  container.innerHTML='';
  const grid = document.createElement('div');
  grid.className='calendar-grid';
  grid.appendChild(document.createElement('div'));
  monthsShort.forEach(m=>{ const c=document.createElement('div'); c.className='calendar-cell header'; c.textContent=m; grid.appendChild(c); });
  for(let d=1; d<=31; d++){
    const day=document.createElement('div'); day.className='calendar-cell day'; day.textContent=d; grid.appendChild(day);
    monthsFull.forEach((_,mi)=>{
      const cell=document.createElement('div'); cell.className='calendar-cell'; cell.onclick=()=>openModal(user,type,d,mi,cell); grid.appendChild(cell); loadCell(user,type,d,mi,cell);
    });
  }
  container.appendChild(grid);
}

async function loadCell(user,type,day,month,cell){
  const key=`${user}_${type}_${day}_${month}`;
  if(cellLocks[key]) return; cellLocks[key]=true;
  try{
    const snap = await getDoc(doc(db,'metas',key));
    if(snap.exists()){
      const v = snap.data();
      // Mostrar emojis correctamente según el tipo
      if(type==='biblia') cell.textContent = v.class==='tick'?'✔':v.class==='cross'?'✖':'';
      else cell.textContent = v.label || '';
      cell.className = 'calendar-cell ' + (v.class || '');
    }
  } catch(e){ console.warn(e); }
  cellLocks[key]=false;
}

window.openModal = (user,type,day,month,cell) => {
  currentContext = {user,type,day,month,cell};
  const opts = document.getElementById('modal-options'); opts.innerHTML='';
  document.getElementById('modal-title').textContent = `${day} de ${monthsFull[month]}`;
  const optionsMap = {
    'biblia': ['✔','✖'],
    'emocional': ['😞','😐','🙂','🤩'],
    'agua': ['2 Vasos 💧','4 Vasos 💧','6 Vasos 💧','8 Vasos 💧'],
    'ejercicio': ['🏋️ Fuerza','🏃 Cardio','🛌 Descanso'],
    'skincare': ['📓 Journal','🧴 Skincare','⭐ Ambas'],
    'lectura': ['No he leído','0-10 páginas','10-20 páginas','Más de 20 páginas']
  };
  optionsMap[type]?.forEach(o=>addOpt(o,clsFromLabel(type,o)));
  addOpt('','blank');
  document.getElementById('modal').classList.add('active');
};

function clsFromLabel(type,label){
  const map = {
    'biblia': {'✔':'tick','✖':'cross'},
    'emocional': {'😞':'bad','😐':'normal','🙂':'good','🤩':'great'},
    'agua': {'2 Vasos 💧':'water-2','4 Vasos 💧':'water-4','6 Vasos 💧':'water-6','8 Vasos 💧':'water-8'},
    'ejercicio': {'🏋️ Fuerza':'exercise-strength','🏃 Cardio':'exercise-cardio','🛌 Descanso':'exercise-rest'},
    'skincare': {'📓 Journal':'skincare-journal','🧴 Skincare':'skincare-skin','⭐ Ambas':'skincare-both'},
    'lectura': {'No he leído':'reading-0','0-10 páginas':'reading-10','10-20 páginas':'reading-20','Más de 20 páginas':'reading-30'}
  };
  return map[type][label] || '';
}

function addOpt(label,cls){
  const b=document.createElement('button');
  b.className = cls==='blank'?'blank':'';
  b.textContent = label === '' ? 'Vaciar' : label;
  b.onclick = async()=>{
    const {user,type,day,month,cell} = currentContext;
    if(cls==='blank'){
      cell.textContent=''; cell.className='calendar-cell';
      try{ await deleteDoc(doc(db,'metas',`${user}_${type}_${day}_${month}`)); } catch(e){ console.warn(e); }
      closeModal(); return;
    }
    // Asignar emoji según tipo
    let emoji = label;
    if(type==='biblia') emoji = cls==='tick'?'✔':cls==='cross'?'✖':'';
    else if(type==='lectura') emoji = cls==='reading-0'?'❌':'📖';
    else if(type==='skincare') emoji = cls==='skincare-journal'?'📓':cls==='skincare-skin'?'🧴':'⭐';
    else if(type==='ejercicio') emoji = cls==='exercise-strength'?'🏋️':cls==='exercise-cardio'?'🏃':'🛌';
    else if(type==='agua') emoji = '💧';
    else if(type==='emocional') emoji = cls==='bad'?'😞':cls==='normal'?'😐':cls==='good'?'🙂':'🤩';
    cell.textContent = emoji;
    cell.className = 'calendar-cell ' + cls;
    try{ await setDoc(doc(db,'metas',`${user}_${type}_${day}_${month}`),{label,class:cls}); } catch(e){ console.warn(e); }
    closeModal();
  };
  document.getElementById('modal-options').appendChild(b);
}

window.closeModal = ()=>{ document.getElementById('modal').classList.remove('active'); };
</script>
</body>
</html>
