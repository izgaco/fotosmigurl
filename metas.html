<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metas 2026</title>

<style>
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --primary: #4f46e5;
  --text: #1f2937;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.screen {
  display: none;
  padding: 16px;
}

.screen.active {
  display: block;
}

button {
  border: none;
  padding: 14px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  background: var(--primary);
  color: white;
}

button.secondary {
  background: #e5e7eb;
  color: #111;
}

.user-select {
  display: grid;
  gap: 16px;
  margin-top: 40px;
}

.menu {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}

.menu button {
  flex: 1;
}

.grid {
  display: grid;
  grid-template-columns: 40px repeat(12, 1fr);
  gap: 2px;
  font-size: 11px;
}

.cell {
  background: var(--card);
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
}

.day {
  font-weight: bold;
}

.clickable {
  cursor: pointer;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

.modal.active {
  display: flex;
}

.modal-box {
  background: white;
  width: 90%;
  max-width: 320px;
  padding: 20px;
  border-radius: 16px;
}

.modal-box h3 {
  margin-top: 0;
}

.modal-box button {
  width: 100%;
  margin-top: 10px;
}

.bad { background:#fecaca; }
.normal { background:#fde68a; }
.good { background:#bbf7d0; }
.great { background:#bfdbfe; }

.water-1 { background: #e0f2fe; }
.water-2 { background: #bae6fd; }
.water-3 { background: #7dd3fc; }
.water-4 { background: #38bdf8; color: #fff; }

</style>
</head>

<body>

<!-- SELECCIÓN USUARIO -->
<div id="screen-user" class="screen active">
  <h2>¿Quién hace el seguimiento?</h2>
  <div class="user-select">
    <button onclick="selectUser('Izhar')">Izhar</button>
    <button onclick="selectUser('Camila')">Camila</button>
  </div>
</div>

<!-- CAMILA -->
<div id="screen-camila" class="screen">
  <h2>Camila · Metas 2026</h2>

  <div class="menu">
    <button onclick="showSection('emocional')">Año emocional</button>
    <button onclick="showSection('agua')">Beber agua</button>
  </div>

  <div id="section-emocional"></div>
  <div id="section-agua" style="display:none"></div>
</div>

<!-- IZHAR -->
<div id="screen-izhar" class="screen">
  <h2>Izhar · Metas 2026</h2>
  <p>📌 Próximamente se añadirán aquí las cuadrículas de seguimiento.</p>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modal-title">Selecciona</h3>
    <div id="modal-options"></div>
    <button class="secondary" onclick="closeModal()">Cancelar</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCBSbcwyQCz7p5tYHhv0yQT-Q_Mn4M8dro",
  authDomain: "migurl-metas.firebaseapp.com",
  projectId: "migurl-metas"
};

initializeApp(firebaseConfig);
getFirestore();

const months = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
let currentCell = null;
let currentMode = "emocional";

window.selectUser = (user) => {
  document.getElementById("screen-user").classList.remove("active");
  if(user === "Camila") {
    document.getElementById("screen-camila").classList.add("active");
    renderEmotional();
    renderWater();
  } else {
    document.getElementById("screen-izhar").classList.add("active");
  }
};

window.showSection = (section) => {
  currentMode = section;
  document.getElementById("section-emocional").style.display = section==="emocional"?"block":"none";
  document.getElementById("section-agua").style.display = section==="agua"?"block":"none";
};

function baseGrid(container) {
  container.innerHTML = "";
  const grid = document.createElement("div");
  grid.className = "grid";

  grid.appendChild(document.createElement("div"));
  months.forEach(m=>{
    const c=document.createElement("div");
    c.className="cell";
    c.textContent=m;
    grid.appendChild(c);
  });

  for(let d=1; d<=31; d++){
    const day=document.createElement("div");
    day.className="cell day";
    day.textContent=d;
    grid.appendChild(day);

    months.forEach(()=>{
      const cell=document.createElement("div");
      cell.className="cell clickable";
      cell.onclick=()=>openModal(cell);
      grid.appendChild(cell);
    });
  }
  container.appendChild(grid);
}

function renderEmotional() {
  baseGrid(document.getElementById("section-emocional"));
}

function renderWater() {
  baseGrid(document.getElementById("section-agua"));
}

window.openModal = (cell) => {
  currentCell = cell;
  const opts = document.getElementById("modal-options");
  opts.innerHTML = "";

  if(currentMode === "emocional") {
  document.getElementById("modal-title").textContent = "Estado del día";
  addOption("😞", "bad");
  addOption("😐", "normal");
  addOption("🙂", "good");
  addOption("🤩", "great");
} else {
  document.getElementById("modal-title").textContent = "Vasos de agua";
  addOption("1💧", "water-1");
  addOption("2💧", "water-2");
  addOption("3💧", "water-3");
  addOption("4💧", "water-4");
}
  addOption("","");

  document.getElementById("modal").classList.add("active");
};

function addOption(label, cls) {
  const b=document.createElement("button");
  b.textContent = label || "Dejar en blanco";
  b.onclick = ()=>{
    currentCell.textContent = label;
    currentCell.className = "cell clickable";
    closeModal();
  };
  document.getElementById("modal-options").appendChild(b);
}

window.closeModal = () => {
  document.getElementById("modal").classList.remove("active");
};
</script>

</body>
</html>
