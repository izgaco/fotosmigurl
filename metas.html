<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metas 2026</title>

<style>
/* =================
   MOBILE FIRST
================= */
body {
  font-family: system-ui, sans-serif;
  margin: 0;
  padding: 8px;
}

h1, h2 {
  text-align: center;
  margin: 8px 0;
}

select, button {
  font-size: 15px;
  padding: 6px;
  margin: 4px;
}

.menu {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}

.table-container {
  overflow-x: auto;
}

table {
  border-collapse: collapse;
  width: 100%;
  table-layout: fixed;
  font-size: 11px;
}

th, td {
  border: 1px solid #ccc;
  text-align: center;
  padding: 2px;
  min-width: 22px;
}

td {
  height: 26px;
  cursor: pointer;
}

/* Estados */
.malo { background:#f44336; color:white; }
.normal { background:#ffc107; }
.bueno { background:#4caf50; color:white; }
.genial { background:#2196f3; color:white; }

.ok { background:#4caf50; color:white; }
.no { background:#f44336; color:white; }

/* Modal */
#modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: none;
  align-items: center;
  justify-content: center;
}

#modal-content {
  background: white;
  padding: 15px;
  border-radius: 10px;
  width: 90%;
  max-width: 300px;
}

button.modal-btn {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
}

.hidden { display: none; }
</style>
</head>

<body>

<h1>Metas 2026</h1>

<select id="userSelect"></select>

<div id="panelMenu" class="menu"></div>

<div class="table-container">
  <div id="grid"></div>
</div>

<div id="modal">
  <div id="modal-content"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* =================
   FIREBASE
================= */
firebase.initializeApp({
  apiKey: "AIzaSyCBSbcwyQCz7p5tYHhv0yQT-Q_Mn4M8dro",
  authDomain: "migurl-metas.firebaseapp.com",
  projectId: "migurl-metas"
});
const db = firebase.firestore();

/* =================
   CONFIGURACIÓN
================= */
const USERS = {
  Izhar: ["emocional", "lectura"],
  Camila: ["emocional", "agua"]
};

const PANELS = {
  emocional: { label:"Año emocional", modal:"emocional" },
  agua: { label:"Beber agua", modal:"agua" },
  lectura: { label:"Lectura Biblia", modal:"lectura" }
};

const months = ["E","F","M","A","M","J","J","A","S","O","N","D"];
const daysInMonth = [31,29,31,30,31,30,31,31,30,31,30,31];

let currentUser = "";
let currentPanel = "";
let selectedCell = null;

/* =================
   INIT
================= */
const userSelect = document.getElementById("userSelect");
userSelect.innerHTML = `<option value="">Usuario</option>` +
  Object.keys(USERS).map(u=>`<option>${u}</option>`).join("");

userSelect.onchange = () => {
  currentUser = userSelect.value;
  buildPanelMenu();
};

/* =================
   PANEL MENU
================= */
function buildPanelMenu() {
  const menu = document.getElementById("panelMenu");
  menu.innerHTML = "";
  USERS[currentUser].forEach(p=>{
    const b = document.createElement("button");
    b.textContent = PANELS[p].label;
    b.onclick = ()=>showGrid(p);
    menu.appendChild(b);
  });
}

/* =================
   GRID
================= */
function showGrid(panel) {
  currentPanel = panel;
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  const table = document.createElement("table");
  table.innerHTML = `
    <tr><th></th>${months.map(m=>`<th>${m}</th>`).join("")}</tr>
  `;

  for(let d=1;d<=31;d++){
    const tr = document.createElement("tr");
    tr.innerHTML = `<th>${d}</th>`;
    for(let m=0;m<12;m++){
      const td = document.createElement("td");
      if(d<=daysInMonth[m]){
        td.dataset.id = `${currentUser}-${panel}-${d}-${m+1}`;
        td.onclick = ()=>openModal(td);
      }
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }
  grid.appendChild(table);
  loadDays();
}

/* =================
   MODAL
================= */
function openModal(td){
  selectedCell = td;
  const c = document.getElementById("modal-content");
  if(currentPanel==="lectura"){
    c.innerHTML = `
      <button class="modal-btn" onclick="setDay('ok')">✔️ Leído</button>
      <button class="modal-btn" onclick="setDay('no')">❌ No leído</button>
      <button class="modal-btn" onclick="setDay('')">⬜ En blanco</button>
    `;
  } else {
    c.innerHTML = `
      <button class="modal-btn" onclick="setDay('malo')">😞</button>
      <button class="modal-btn" onclick="setDay('normal')">😐</button>
      <button class="modal-btn" onclick="setDay('bueno')">🙂</button>
      <button class="modal-btn" onclick="setDay('genial')">🤩</button>
      <button class="modal-btn" onclick="setDay('')">⬜</button>
    `;
  }
  document.getElementById("modal").style.display="flex";
}

function setDay(v){
  selectedCell.className="";
  selectedCell.textContent="";
  if(v){
    selectedCell.classList.add(v);
    selectedCell.textContent = v==="ok"?"✔":v==="no"?"✖":"";
  }
  db.collection("days").doc(selectedCell.dataset.id).set({value:v});
  document.getElementById("modal").style.display="none";
}

/* =================
   LOAD
================= */
function loadDays(){
  db.collection("days").get().then(s=>{
    s.forEach(d=>{
      const cell=document.querySelector(`[data-id="${d.id}"]`);
      if(!cell) return;
      const v=d.data().value;
      if(v){
        cell.classList.add(v);
        cell.textContent = v==="ok"?"✔":v==="no"?"✖":"";
      }
    });
  });
}

document.getElementById("modal").onclick=e=>{
  if(e.target.id==="modal") e.target.style.display="none";
};
</script>

</body>
</html>
