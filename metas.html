<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metas 2026</title>

<style>
body {
  font-family: system-ui, sans-serif;
  margin: 0;
  padding: 10px;
}

h1 {
  text-align: center;
}

table {
  border-collapse: collapse;
  width: 100%;
  font-size: 12px;
}

th, td {
  border: 1px solid #ccc;
  text-align: center;
  padding: 4px;
}

td {
  cursor: pointer;
  height: 32px;
}

.malo { background:#f44336; color:white; }
.normal { background:#ffc107; }
.bueno { background:#4caf50; color:white; }
.genial { background:#2196f3; color:white; }

#modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: none;
  align-items: center;
  justify-content: center;
}

#modal div {
  background: white;
  padding: 20px;
  border-radius: 10px;
  width: 90%;
  max-width: 300px;
}

button {
  width: 100%;
  margin: 6px 0;
  padding: 10px;
  font-size: 16px;
}
</style>
</head>

<body>

<h1>Metas 2026</h1>
<div id="grid"></div>

<div id="modal">
  <div>
    <button onclick="setDay('')">⬜ En blanco</button>
    <button onclick="setDay('malo')">😞 Día malo</button>
    <button onclick="setDay('normal')">😐 Día normal</button>
    <button onclick="setDay('bueno')">🙂 Día bueno</button>
    <button onclick="setDay('genial')">🤩 Día genial</button>
    <button onclick="closeModal()">Cancelar</button>
  </div>
</div>

<!-- Firebase COMPAT (SIN IMPORTS) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* =========================
   FIREBASE CONFIG (TUYA)
========================= */
const firebaseConfig = {
  apiKey: "AIzaSyCBSbcwyQCz7p5tYHhv0yQT-Q_Mn4M8dro",
  authDomain: "migurl-metas.firebaseapp.com",
  projectId: "migurl-metas",
  storageBucket: "migurl-metas.firebasestorage.app",
  messagingSenderId: "1012055520964",
  appId: "1:1012055520964:web:b67ae486ed1ce5edf77b91",
  measurementId: "G-GJTCYQFVF2"
};

/* =========================
   VARIABLES
========================= */
const months = ["Enero","Febrero","Marzo","Abril","Mayo","Junio",
                "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const daysInMonth = [31,29,31,30,31,30,31,31,30,31,30,31];

let selectedCell = null;
let db = null;

/* =========================
   CREAR CUADRÍCULA (SIEMPRE)
========================= */
function createGrid() {
  const table = document.createElement("table");
  const header = document.createElement("tr");
  header.innerHTML = "<th>Día</th>" + months.map(m => `<th>${m}</th>`).join("");
  table.appendChild(header);

  for (let d = 1; d <= 31; d++) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<th>${d}</th>`;

    for (let m = 0; m < 12; m++) {
      const td = document.createElement("td");
      if (d <= daysInMonth[m]) {
        td.dataset.id = `${d}-${m+1}`;
        td.onclick = () => openModal(td);
      }
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }

  document.getElementById("grid").appendChild(table);
}

/* =========================
   MODAL
========================= */
function openModal(td) {
  selectedCell = td;
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

function setDay(type) {
  selectedCell.className = "";
  selectedCell.textContent = "";

  if (type) {
    selectedCell.classList.add(type);
    selectedCell.textContent =
      type === "malo" ? "😞" :
      type === "normal" ? "😐" :
      type === "bueno" ? "🙂" : "🤩";
  }

  saveDay(selectedCell.dataset.id, type);
  closeModal();
}

/* =========================
   FIRESTORE
========================= */
function initFirebase() {
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    loadDays();
  } catch (e) {
    console.warn("Firebase no disponible", e);
  }
}

function saveDay(id, value) {
  if (!db) return;
  db.collection("days").doc(id).set({ value });
}

function loadDays() {
  db.collection("days").get().then(snapshot => {
    snapshot.forEach(doc => {
      const cell = document.querySelector(`[data-id="${doc.id}"]`);
      if (!cell) return;

      const v = doc.data().value;
      if (v) {
        cell.classList.add(v);
        cell.textContent =
          v === "malo" ? "😞" :
          v === "normal" ? "😐" :
          v === "bueno" ? "🙂" : "🤩";
      }
    });
  });
}

/* =========================
   ARRANQUE
========================= */
createGrid();   // SIEMPRE
initFirebase(); // SI PUEDE
</script>

</body>
</html>
