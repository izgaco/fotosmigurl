<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabú</title>

<style>
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: #d9d9d9;
    color: #222;
  }

  .screen {
    display: none;
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
  }

  .screen.active {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
  }

  input {
    width: 100%;
    font-size: 18px;
    padding: 14px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: none;
  }

  button {
    width: 100%;
    font-size: 20px;
    padding: 16px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    background: #333;
    color: white;
    cursor: pointer;
  }

  button:active {
    transform: scale(0.98);
  }

  /* JUEGO */
  .timer {
    text-align: center;
    font-size: 28px;
    margin-bottom: 20px;
  }

  .card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    text-align: center;
  }

  .card h2 {
    font-size: 36px;
    margin-bottom: 15px;
  }

  .card ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .card li {
    font-size: 20px;
    color: #c00000;
    margin: 5px 0;
  }

  .game-buttons {
    display: flex;
    gap: 10px;
  }

  .game-buttons button {
    flex: 1;
    font-size: 22px;
  }

  .ok { background: #2e7d32; }
  .fail { background: #c62828; }
</style>
</head>

<body>

<!-- CONFIG -->
<div id="screen-config" class="screen active">
  <h1>Configuración Tabú</h1>

  <input id="teamRedName" placeholder="Equipo rojo">
  <input id="teamBlueName" placeholder="Equipo azul">

  <input id="roundTime" type="number" placeholder="Tiempo por ronda (segundos)">
  <input id="numRounds" type="number" placeholder="Número de rondas">

  <button onclick="empezarJuego()">Empezar juego</button>
</div>

<!-- START -->
<div id="screen-start" class="screen">
  <h1 id="startText"></h1>
  <button onclick="iniciarTurno()">Listo</button>
</div>

<!-- GAME -->
<div id="screen-game" class="screen">
  <div class="timer">⏱ <span id="timeLeft">60</span>s</div>

  <div class="card">
    <h2 id="mainWord">PALABRA</h2>
    <ul id="forbiddenWords"></ul>
  </div>

  <div class="game-buttons">
    <button class="ok" onclick="acierto()">✔</button>
    <button class="fail" onclick="tabu()">✖</button>
  </div>
</div>

<script>
function mostrarPantalla(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

const palabras = [
  { palabra: "PLAYA", prohibidas: ["arena", "mar", "sol", "verano", "vacaciones"] },
  { palabra: "COCHE", prohibidas: ["motor", "ruedas", "conducir", "gasolina", "carretera"] },
  { palabra: "PERRO", prohibidas: ["animal", "ladrar", "mascota", "cola", "gato"] }
];

let equipoActual = "rojo";
let temporizador;
let tiempoRestante;

function empezarJuego() {
  const rojo = teamRedName.value || "Equipo rojo";
  const azul = teamBlueName.value || "Equipo azul";

  window.gameState = {
    equipos: {
      rojo: { nombre: rojo, puntos: 0 },
      azul: { nombre: azul, puntos: 0 }
    },
    tiempo: parseInt(roundTime.value) || 60
  };

  startText.textContent = "Empieza " + window.gameState.equipos[equipoActual].nombre;
  mostrarPantalla("screen-start");
}

function iniciarTurno() {
  mostrarPantalla("screen-game");
  nuevaPalabra();
  iniciarTemporizador();
}

function nuevaPalabra() {
  const p = palabras[Math.floor(Math.random() * palabras.length)];
  mainWord.textContent = p.palabra;

  forbiddenWords.innerHTML = "";
  p.prohibidas.forEach(w => {
    const li = document.createElement("li");
    li.textContent = w;
    forbiddenWords.appendChild(li);
  });
}

function iniciarTemporizador() {
  clearInterval(temporizador);
  tiempoRestante = window.gameState.tiempo;
  timeLeft.textContent = tiempoRestante;

  temporizador = setInterval(() => {
    tiempoRestante--;
    timeLeft.textContent = tiempoRestante;

    if (tiempoRestante <= 0) {
      clearInterval(temporizador);
      alert("Fin del turno");
    }
  }, 1000);
}

function acierto() {
  window.gameState.equipos[equipoActual].puntos++;
  nuevaPalabra();
}

function tabu() {
  nuevaPalabra();
}
</script>

</body>
</html>
