<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tabú</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #e0e0e0;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .screen {
      display: none;
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
    }

    .screen.active {
      display: block;
    }

    h1 {
      margin-bottom: 15px;
    }

    .timer {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .card {
      background: #f5f5f5;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .word {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .forbidden {
      font-size: 18px;
      color: #c62828;
      margin: 4px 0;
    }

    button {
      width: 100%;
      padding: 16px;
      margin: 8px 0;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .green { background: #2e7d32; color: white; }
    .red { background: #c62828; color: white; }
    .gray { background: #9e9e9e; color: white; }

    .team-name {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <!-- PANTALLA EQUIPO INICIAL -->
  <div id="screen-start" class="screen active">
    <h1>Empieza el equipo</h1>
    <div id="startingTeam" class="team-name"></div>
    <button class="gray" onclick="comenzarRonda()">Listo</button>
  </div>

  <!-- PANTALLA RONDA -->
  <div id="screen-round" class="screen">
    <div id="timer" class="timer"></div>

    <div class="card">
      <div id="word" class="word"></div>
      <div id="forbidden"></div>
    </div>

    <button class="green" onclick="respuesta('ok')">✅ Acierto</button>
    <button class="gray" onclick="respuesta('pass')">⏭️ Pasar</button>
    <button class="red" onclick="respuesta('fail')">❌ Fallo</button>
  </div>

  <!-- PANTALLA RESUMEN -->
  <div id="screen-summary" class="screen">
    <h1>Fin de la ronda</h1>
    <p id="summaryText"></p>
    <button class="gray" onclick="siguienteEquipo()">Siguiente equipo</button>
  </div>

  <script>
    const cards = [
      { word: "Cruasán", forbidden: ["Medialuna", "Dulce", "Masa", "Francés", "Desayuno"] },
      { word: "Playa", forbidden: ["Arena", "Mar", "Sol", "Sombrilla", "Vacaciones"] },
      { word: "Teléfono", forbidden: ["Llamar", "Móvil", "Pantalla", "App", "Número"] },
      { word: "Avión", forbidden: ["Volar", "Piloto", "Aeropuerto", "Alas", "Viaje"] },
      { word: "Coche", forbidden: ["Motor", "Conducir", "Ruedas", "Gasolina", "Carretera"] }
    ];

    const game = {
      teamRed: "Equipo rojo",
      teamBlue: "Equipo azul",
      currentTeam: Math.random() < 0.5 ? 'red' : 'blue',
      time: 60,
      timer: null,
      remaining: 0,
      usedCards: [],
      results: { ok: 0, pass: 0, fail: 0 }
    };

    document.getElementById('startingTeam').textContent =
      game.currentTeam === 'red' ? game.teamRed : game.teamBlue;

    function comenzarRonda() {
      game.remaining = game.time;
      game.results = { ok: 0, pass: 0, fail: 0 };
      mostrarCarta();
      document.getElementById('timer').textContent = game.remaining;
      mostrar('screen-round');

      game.timer = setInterval(() => {
        game.remaining--;
        document.getElementById('timer').textContent = game.remaining;
        if (game.remaining <= 0) {
          clearInterval(game.timer);
          finRonda();
        }
      }, 1000);
    }

    function mostrarCarta() {
      const card = cards[Math.floor(Math.random() * cards.length)];
      document.getElementById('word').textContent = card.word;
      const forb = document.getElementById('forbidden');
      forb.innerHTML = "";
      card.forbidden.forEach(w => {
        const div = document.createElement('div');
        div.className = 'forbidden';
        div.textContent = w;
        forb.appendChild(div);
      });
    }

    function respuesta(tipo) {
      game.results[tipo]++;
      mostrarCarta();
    }

    function finRonda() {
      mostrar('screen-summary');
      document.getElementById('summaryText').innerHTML =
        `Aciertos: ${game.results.ok}<br>
         Pasadas: ${game.results.pass}<br>
         Fallos: ${game.results.fail}`;
    }

    function siguienteEquipo() {
      game.currentTeam = game.currentTeam === 'red' ? 'blue' : 'red';
      document.getElementById('startingTeam').textContent =
        game.currentTeam === 'red' ? game.teamRed : game.teamBlue;
      mostrar('screen-start');
    }

    function mostrar(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
  </script>

</body>
</html>
