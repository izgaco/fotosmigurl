<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tabú</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #e0e0e0;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .screen {
      display: none;
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
    }

    .screen.active {
      display: block;
    }

    h1 {
      margin-bottom: 15px;
    }

    .timer {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .card {
      background: #f5f5f5;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .word {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .forbidden {
      font-size: 18px;
      color: #c62828;
      margin: 4px 0;
    }

    button {
      width: 100%;
      padding: 16px;
      margin: 8px 0;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .green { background: #2e7d32; color: white; }
    .red { background: #c62828; color: white; }
    .gray { background: #9e9e9e; color: white; }

    .team-name {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <!-- PANTALLA EQUIPO INICIAL -->
  <div id="screen-start" class="screen active">
    <h1>Empieza el equipo</h1>
    <div id="startingTeam" class="team-name"></div>
    <button class="gray" onclick="comenzarRonda()">Listo</button>
  </div>

  <!-- PANTALLA RONDA -->
  <div id="screen-round" class="screen">
    <div id="timer" class="timer"></div>

    <div class="card">
      <div id="word" class="word"></div>
      <div id="forbidden"></div>
    </div>

    <button class="green" onclick="respuesta('ok')">✅ Acierto</button
