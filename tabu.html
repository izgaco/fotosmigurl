<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tabú</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #e0e0e0;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .screen {
      display: none;
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
    }

    .screen.active {
      display: block;
    }

    h1 {
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 18px;
      margin: 12px 0;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .red {
      background: #c62828;
      color: white;
    }

    .blue {
      background: #1565c0;
      color: white;
    }

    .gray {
      background: #9e9e9e;
      color: white;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    .team-name {
      font-size: 26px;
      font-weight: bold;
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <!-- PANTALLA 1: MENÚ -->
  <div id="screen-menu" class="screen active">
    <h1>🟥 Tabú</h1>
    <button class="red" onclick="irModoEquipos()">Modo por equipos</button>
    <button class="gray" onclick="irConstruccion()">Modo uno contra todos</button>
    <p style="font-size:14px;color:#555">En construcción</p>
  </div>

  <!-- PANTALLA 2: CONFIGURACIÓN -->
  <div id="screen-config" class="screen">
    <h1>⚙️ Configuración</h1>

    <input id="teamRed" type="text" placeholder="Equipo rojo">
    <input id="teamBlue" type="text" placeholder="Equipo azul">

    <input id="time" type="number" value="60" min="10">
    <input id="rounds" type="number" value="2" min="1">

    <button class="red" onclick="empezar()">Empezar</button>
    <button class="gray" onclick="volver()">Volver</button>
  </div>

  <!-- PANTALLA 3: EQUIPO INICIAL -->
  <div id="screen-start" class="screen">
    <h1>Empieza el equipo</h1>
    <div id="startingTeam" class="team-name"></div>
    <button class="gray" onclick="listo()">Listo</button>
  </div>

  <!-- PANTALLA 4: EN CONSTRUCCIÓN -->
  <div id="screen-build" class="screen">
    <h1>🚧 En construcción</h1>
    <p>Este modo llegará pronto</p>
    <button class="red" onclick="volver()">Volver</button>
  </div>

  <script>
    const game = {};

    function mostrar(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function irModoEquipos() {
      mostrar('screen-config');
    }

    function irConstruccion() {
      mostrar('screen-build');
    }

    function volver() {
      mostrar('screen-menu');
    }

    function empezar() {
      game.teamRed = document.getElementById('teamRed').value || 'Equipo rojo';
      game.teamBlue = document.getElementById('teamBlue').value || 'Equipo azul';
      game.time = parseInt(document.getElementById('time').value) || 60;
      game.rounds = parseInt(document.getElementById('rounds').value) || 2;

      // Equipo inicial aleatorio
      game.currentTeam = Math.random() < 0.5 ? 'red' : 'blue';

      const teamName = game.currentTeam === 'red' ? game.teamRed : game.teamBlue;
      const teamDiv = document.getElementById('startingTeam');
      teamDiv.textContent = teamName;
      teamDiv.style.color = game.currentTeam === 'red' ? '#c62828' : '#1565c0';

      mostrar('screen-start');
    }

    function listo() {
      alert('Aquí empezará la ronda con contador y cartas (siguiente paso)');
    }
  </script>

</body>
</html>
