<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tabú</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e0e0e0;
      text-align: center;
    }

    .screen {
      display: none;
      padding: 20px;
    }

    .screen.active {
      display: block;
    }

    input {
      padding: 8px;
      margin: 5px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      margin: 10px;
      cursor: pointer;
    }

    /* JUEGO */
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin: 20px auto;
      width: 80%;
      max-width: 400px;
    }

    .card h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .card ul {
      list-style: none;
      padding: 0;
    }

    .card li {
      color: red;
      font-size: 18px;
    }

    .timer {
      font-size: 24px;
      margin: 10px;
    }

    .game-buttons button {
      font-size: 18px;
      margin: 10px;
      padding: 10px 20px;
    }
  </style>
</head>
<body>

<!-- PANTALLA CONFIGURACIÓN -->
<div id="screen-config" class="screen active">
  <h1>Configuración Tabú</h1>

  <div>
    <input id="teamRedName" placeholder="Equipo rojo" />
    <input id="teamBlueName" placeholder="Equipo azul" />
  </div>

  <div>
    <input id="roundTime" type="number" placeholder="Tiempo por ronda (seg)" />
    <input id="numRounds" type="number" placeholder="Número de rondas" />
  </div>

  <button onclick="empezarJuego()">Empezar juego</button>
</div>

<!-- PANTALLA INICIO TURNO -->
<div id="screen-start" class="screen">
  <h1 id="startText">Empieza el equipo</h1>
  <button onclick="iniciarTurno()">¡Empezar!</button>
</div>

<!-- PANTALLA JUEGO -->
<div id="screen-game" class="screen">
  <h1 id="turnTitle">Turno del equipo</h1>

  <div class="timer">
    ⏱️ <span id="timeLeft">60</span> s
  </div>

  <div class="card">
    <h2 id="mainWord">PALABRA</h2>
    <ul id="forbiddenWords"></ul>
  </div>

  <div class="game-buttons">
    <button onclick="acierto()">✅ Acierto</button>
    <button onclick="tabu()">❌ Tabú</button>
  </div>
</div>

<script>
/* UTILIDAD */
function mostrarPantalla(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* DATOS DEL JUEGO */
const palabras = [
  { palabra: "PLAYA", prohibidas: ["arena", "mar", "verano", "sol", "vacaciones"] },
  { palabra: "COCHE", prohibidas: ["ruedas", "motor", "conducir", "carretera", "gasolina"] },
  { palabra: "PERRO", prohibidas: ["animal", "ladrar", "mascota", "cola", "gato"] }
];

let palabraActual = null;
let tiempoRestante = 0;
let temporizador = null;
let equipoActual = "rojo";

/* CONFIGURACIÓN */
function empezarJuego() {
  const teamRed = document.getElementById("teamRedName").value || "Equipo rojo";
  const teamBlue = document.getElementById("teamBlueName").value || "Equipo azul";
  const tiempo = parseInt(document.getElementById("roundTime").value) || 60;
  const rondas = parseInt(document.getElementById("numRounds").value) || 2;

  window.gameState = {
    equipos: {
      rojo: { nombre: teamRed, puntos: 0 },
      azul: { nombre: teamBlue, puntos: 0 }
    },
    tiempoPorRonda: tiempo,
    rondasTotales: rondas,
    rondaActual: 1
  };

  equipoActual = "rojo";
  document.getElementById("startText").textContent =
    "Empieza el equipo " + window.gameState.equipos[equipoActual].nombre;

  mostrarPantalla("screen-start");
}

/* INICIO TURNO */
function iniciarTurno() {
  mostrarPantalla("screen-game");

  document.getElementById("turnTitle").textContent =
    "Turno del equipo " + window.gameState.equipos[equipoActual].nombre;

  nuevaPalabra();
  iniciarTemporizador();
}

/* PALABRAS */
function nuevaPalabra() {
  palabraActual = palabras[Math.floor(Math.random() * palabras.length)];

  document.getElementById("mainWord").textContent = palabraActual.palabra;

  const ul = document.getElementById("forbiddenWords");
  ul.innerHTML = "";

  palabraActual.prohibidas.forEach(p => {
    const li = document.createElement("li");
    li.textContent = p;
    ul.appendChild(li);
  });
}

/* TEMPORIZADOR */
function iniciarTemporizador() {
  clearInterval(temporizador);
  tiempoRestante = window.gameState.tiempoPorRonda;
  document.getElementById("timeLeft").textContent = tiempoRestante;

  temporizador = setInterval(() => {
    tiempoRestante--;
    document.getElementById("timeLeft").textContent = tiempoRestante;

    if (tiempoRestante <= 0) {
      clearInterval(temporizador);
      alert("⏰ Fin del turno");
    }
  }, 1000);
}

/* BOTONES */
function acierto() {
  window.gameState.equipos[equipoActual].puntos++;
  nuevaPalabra();
}

function tabu() {
  nuevaPalabra();
}
</script>

</body>
</html>
