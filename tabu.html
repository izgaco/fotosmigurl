<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tabú</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #e0e0e0;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .screen {
      display: none;
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
    }

    .screen.active {
      display: block;
    }

    h1 { margin-bottom: 10px; }

    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .red { background: #c62828; color: white; }
    .blue { background: #1565c0; color: white; }
    .gray { background: #9e9e9e; color: white; }
    .green { background: #2e7d32; color: white; }

    input {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    .timer {
      font-size: 36px;
      font-weight: bold;
      margin: 10px 0;
    }

    .info {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .card {
      background: #f5f5f5;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .word {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .forbidden {
      color: #c62828;
      font-size: 18px;
    }

    .team-name {
      font-size: 26px;
      font-weight: bold;
      margin: 15px 0;
    }

    .score {
      font-size: 18px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<!-- MENÚ -->
<div id="menu" class="screen active">
  <h1>🟥 Tabú</h1>
  <button class="red" onclick="mostrar('config')">Modo por equipos</button>
  <button class="gray" onclick="mostrar('build')">Modo uno contra todos</button>
  <p style="font-size:14px;color:#555">En construcción</p>
</div>

<!-- CONFIGURACIÓN -->
<div id="config" class="screen">
  <h1>⚙️ Configuración</h1>
  <input id="teamRed" placeholder="Equipo rojo">
  <input id="teamBlue" placeholder="Equipo azul">
  <input id="time" type="number" value="60" min="10">
  <input id="rounds" type="number" value="4" min="1">
  <button class="red" onclick="iniciarJuego()">Empezar</button>
  <button class="gray" onclick="mostrar('menu')">Volver</button>
</div>

<!-- EQUIPO INICIAL -->
<div id="start" class="screen">
  <h1>Empieza</h1>
  <div id="startingTeam" class="team-name"></div>
  <div class="info" id="roundInfo"></div>
  <button class="gray" onclick="comenzarRonda()">Listo</button>
</div>

<!-- RONDA -->
<div id="round" class="screen">
  <div class="info" id="gameInfo"></div>
  <div id="timer" class="timer"></div>

  <div class="card">
    <div id="word" class="word"></div>
    <div id="forbidden"></div>
  </div>

  <button class="green" onclick="respuesta('ok')">✅ Acierto</button>
  <button class="gray" onclick="respuesta('pass')">⏭️ Pasar</button>
  <button class="red" onclick="respuesta('fail')">❌ Fallo</button>
</div>

<!-- RESUMEN -->
<div id="summary" class="screen">
  <h1>Fin de ronda</h1>
  <p id="summaryText"></p>
  <div class="score" id="scoreBoard"></div>
  <button class="gray" onclick="siguienteTurno()">Continuar</button>
</div>

<!-- FINAL -->
<div id="end" class="screen">
  <h1>🏆 Fin de la partida</h1>
  <div id="winner" class="team-name"></div>
  <div class="score" id="finalScore"></div>
  <button class="red" onclick="mostrar('menu')">Volver al menú</button>
</div>

<!-- EN CONSTRUCCIÓN -->
<div id="build" class="screen">
  <h1>🚧 En construcción</h1>
  <button class="red" onclick="mostrar('menu')">Volver</button>
</div>

<script>
const cards = [
  { word: "Cruasán", forbidden: ["Medialuna","Dulce","Masa","Francés","Desayuno"] },
  { word: "Playa", forbidden: ["Arena","Mar","Sol","Vacaciones","Sombrilla"] },
  { word: "Teléfono", forbidden: ["Móvil","Llamar","Pantalla","App","Número"] },
  { word: "Coche", forbidden: ["Auto","Conducir","Ruedas","Motor","Carretera"] }
];

let deck = [];
const game = {};

function mostrar(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function iniciarJuego() {
  game.teamRed = teamRed.value || "Equipo rojo";
  game.teamBlue = teamBlue.value || "Equipo azul";
  game.time = Math.max(10, parseInt(time.value));
  game.roundsTotal = parseInt(rounds.value);
  game.roundCurrent = 1;
  game.currentTeam = Math.random() < 0.5 ? 'red' : 'blue';
  game.score = { red: 0, blue: 0 };
  prepararBaraja();
  actualizarPantallaInicio();
  mostrar('start');
}

function prepararBaraja() {
  deck = [...cards].sort(() => Math.random() - 0.5);
}

function actualizarPantallaInicio() {
  startingTeam.textContent =
    game.currentTeam === 'red' ? game.teamRed : game.teamBlue;
  roundInfo.textContent =
    `Ronda ${game.roundCurrent} de ${game.roundsTotal}`;
}

function comenzarRonda() {
  clearInterval(game.interval);
  game.remaining = game.time;
  game.results = { ok:0, pass:0, fail:0 };
  mostrarCarta();
  actualizarInfoJuego();
  timer.textContent = game.remaining;
  mostrar('round');

  game.interval = setInterval(() => {
    game.remaining--;
    timer.textContent = game.remaining;
    if (game.remaining <= 0) {
      clearInterval(game.interval);
      finRonda();
    }
  }, 1000);
}

function actualizarInfoJuego() {
  const teamName = game.currentTeam === 'red' ? game.teamRed : game.teamBlue;
  gameInfo.textContent = `${teamName} · Ronda ${game.roundCurrent}`;
}

function mostrarCarta() {
  if (deck.length === 0) prepararBaraja();
  const c = deck.pop();
  word.textContent = c.word;
  forbidden.innerHTML = c.forbidden.map(f => `<div class="forbidden">${f}</div>`).join("");
}

function respuesta(t) {
  game.results[t]++;
  mostrarCarta();
}

function finRonda() {
  game.score[game.currentTeam] += game.results.ok;
  summaryText.innerHTML =
    `Aciertos: ${game.results.ok}<br>
     Pasadas: ${game.results.pass}<br>
     Fallos: ${game.results.fail}`;
  scoreBoard.innerHTML =
    `${game.teamRed}: ${game.score.red} puntos<br>
     ${game.teamBlue}: ${game.score.blue} puntos`;
  mostrar('summary');
}

function siguienteTurno() {
  if (game.currentTeam === 'blue') game.roundCurrent++;
  game.currentTeam = game.currentTeam === 'red' ? 'blue' : 'red';

  if (game.roundCurrent > game.roundsTotal) {
    mostrarFinal();
  } else {
    actualizarPantallaInicio();
    mostrar('start');
  }
}

function mostrarFinal() {
  let texto;
  if (game.score.red > game.score.blue) texto = `🏆 Gana ${game.teamRed}`;
  else if (game.score.blue > game.score.red) texto = `🏆 Gana ${game.teamBlue}`;
  else texto = "🤝 Empate";

  winner.textContent = texto;
  finalScore.innerHTML =
    `${game.teamRed}: ${game.score.red} puntos<br>
     ${game.teamBlue}: ${game.score.blue} puntos`;
  mostrar('end');
}
</script>

</body>
</html>
