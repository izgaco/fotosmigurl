<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tabú</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #e0e0e0;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .screen {
      display: none;
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
    }

    .screen.active {
      display: block;
    }

    h1 {
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 18px;
      margin: 12px 0;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .red {
      background: #c62828;
      color: white;
    }

    .gray {
      background: #9e9e9e;
      color: white;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <!-- PANTALLA 1 -->
  <div id="screen-menu" class="screen active">
    <h1>🟥 Tabú</h1>

    <button class="red" onclick="irModoEquipos()">Modo por equipos</button>

    <button class="gray" onclick="irConstruccion()">Modo uno contra todos</button>
    <p style="font-size:14px;color:#555">En construcción</p>
  </div>

  <!-- PANTALLA 2 -->
  <div id="screen-config" class="screen">
    <h1>⚙️ Configuración</h1>

    <input id="teamRed" type="text" placeholder="Equipo rojo">
    <input id="teamBlue" type="text" placeholder="Equipo azul">

    <input id="time" type="number" value="60" min="10">
    <input id="rounds" type="number" value="2" min="1">

    <button class="red" onclick="empezar()">Empezar</button>
    <button class="gray" onclick="volver()">Volver</button>
  </div>

  <!-- PANTALLA 3 -->
  <div id="screen-build" class="screen">
    <h1>🚧 En construcción</h1>
    <p>Este modo llegará pronto</p>
    <button class="red" onclick="volver()">Volver</button>
  </div>

  <script>
    function mostrar(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function irModoEquipos() {
      mostrar('screen-config');
    }

    function irConstruccion() {
      mostrar('screen-build');
    }

    function volver() {
      mostrar('screen-menu');
    }

    function empezar() {
      const red = document.getElementById('teamRed').value || 'Equipo rojo';
      const blue = document.getElementById('teamBlue').value || 'Equipo azul';
      const time = document.getElementById('time').value;
      const rounds = document.getElementById('rounds').value;

      alert(
        'Configuración guardada:\n\n' +
        red + '\n' +
        blue + '\n' +
        time + ' segundos\n' +
        rounds + ' rondas'
      );
    }
  </script>

</body>
</html>
