<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego del Impostor</title>

<style>
* { box-sizing: border-box; }

body {
    font-family: system-ui, sans-serif;
    background: #ccc;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 420px;
    text-align: center;
}

h1 { font-size: 2rem; margin-bottom: 20px; }
h2 { font-size: 1.5rem; margin-bottom: 20px; }

input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    font-size: 1.1rem;
    border-radius: 10px;
    border: none;
}

button {
    width: 100%;
    padding: 16px;
    margin: 12px 0;
    font-size: 1.2rem;
    font-weight: bold;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    background-color: #1e90ff;
    color: white;
}

.hidden { display: none; }

#roleDisplay {
    margin-top: 20px;
    padding: 25px;
    border-radius: 16px;
}

.citizen { background-color: #1b5e20; color: white; }
.impostor { background-color: #b71c1c; color: white; }

.pass-screen {
    background: #333;
    color: white;
    padding: 30px;
    border-radius: 16px;
}

.secondary {
    background-color: #555;
}
</style>
</head>

<body>

<div class="container">

<h1>🕵️ Juego del Impostor</h1>

<!-- SETUP -->
<div id="setup">
    <input id="numPlayers" type="number" min="2" placeholder="Número de jugadores">
    <input id="numImpostors" type="number" min="1" placeholder="Número de impostores">
    <button id="setPlayersBtn">Siguiente</button>
</div>

<!-- NOMBRES -->
<div id="playerNames" class="hidden"></div>

<!-- PASA EL MÓVIL -->
<div id="passScreen" class="hidden pass-screen">
    <h2 id="passText"></h2>
    <button id="continueBtn">Continuar</button>
</div>

<!-- REVELAR ROL -->
<div id="roleReveal" class="hidden">
    <button id="revealBtn">Revelar rol</button>
    <div id="roleDisplay" class="hidden"></div>
    <button id="nextBtn" class="hidden">Siguiente jugador</button>
</div>

<!-- FINAL -->
<div id="endScreen" class="hidden">
    <h2>✅ Roles repartidos</h2>
    <button onclick="location.reload()">Nueva partida</button>
</div>

</div>

<script>
/* PALABRAS (sin duplicados) */
const words = [
"gato","perro","elefante","león","tigre","oso","lobo","zorro","conejo",
"playa","montaña","bosque","desierto","río","mar","isla",
"avión","tren","barco","coche","bicicleta","moto",
"pizza","hamburguesa","paella","pasta","arroz",
"película","libro","cuadro","fotografía",
"ordenador","móvil","tablet","teclado","pantalla",
"casa","castillo","escuela","hospital","biblioteca",
"ciudad","pueblo","plaza","calle","parque",
"profesor","médico","ingeniero","policía","bombero",
"árbol","flor","planta","jardín",
"sol","luna","estrella","planeta",
"mesa","silla","sofá","cama","armario",
"pelota","dados","cartas","rompecabezas"
];

let secretWord = words[Math.floor(Math.random() * words.length)];
let players = [];
let impostors = [];
let currentPlayer = 0;
let numImpostors = 1;
let gameState = "setup";

/* ELEMENTOS */
const setup = document.getElementById("setup");
const namesDiv = document.getElementById("playerNames");
const passScreen = document.getElementById("passScreen");
const passText = document.getElementById("passText");
const continueBtn = document.getElementById("continueBtn");
const revealDiv = document.getElementById("roleReveal");
const revealBtn = document.getElementById("revealBtn");
const roleDisplay = document.getElementById("roleDisplay");
const nextBtn = document.getElementById("nextBtn");
const endScreen = document.getElementById("endScreen");

/* CONFIGURACIÓN */
document.getElementById("setPlayersBtn").onclick = () => {
    const n = Number(numPlayers.value);
    numImpostors = Number(numImpostorsInput.value || document.getElementById("numImpostors").value);

    if (n < 2 || numImpostors < 1 || numImpostors >= n) {
        alert("Datos incorrectos");
        return;
    }

    setup.classList.add("hidden");
    createNameInputs(n);
};

/* NOMBRES */
function createNameInputs(n) {
    namesDiv.innerHTML = "<h2>Nombres</h2>";
    for (let i = 0; i < n; i++) {
        namesDiv.innerHTML += `<input id="p${i}" placeholder="Jugador ${i+1}">`;
    }
    namesDiv.innerHTML += `<button id="startBtn">Comenzar</button>`;
    namesDiv.classList.remove("hidden");

    document.getElementById("startBtn").onclick = () => {
        players = [];
        for (let i = 0; i < n; i++) {
            const name = document.getElementById(`p${i}`).value.trim();
            if (!name) return alert("Faltan nombres");
            players.push(name);
        }
        assignImpostors();
        namesDiv.classList.add("hidden");
        showPassScreen();
    };
}

/* IMPOSTORES */
function assignImpostors() {
    impostors = [];
    while (impostors.length < numImpostors) {
        const r = Math.floor(Math.random() * players.length);
        if (!impostors.includes(r)) impostors.push(r);
    }
}

/* PASA EL MÓVIL */
function showPassScreen() {
    gameState = "pass";
    passText.textContent = `Pasa el móvil a ${players[currentPlayer]}`;
    passScreen.classList.remove("hidden");
    revealDiv.classList.add("hidden");
}

continueBtn.onclick = () => {
    passScreen.classList.add("hidden");
    showReveal();
};

/* REVELAR */
function showReveal() {
    gameState = "reveal";
    revealDiv.classList.remove("hidden");
    roleDisplay.classList.add("hidden");
    revealBtn.classList.remove("hidden");
    nextBtn.classList.add("hidden");
}

revealBtn.onclick = () => {
    revealBtn.classList.add("hidden");
    roleDisplay.classList.remove("hidden");
    nextBtn.classList.remove("hidden");

    if (impostors.includes(currentPlayer)) {
        roleDisplay.className = "impostor";
        roleDisplay.innerHTML = "<h2>IMPOSTOR</h2>";
    } else {
        roleDisplay.className = "citizen";
        roleDisplay.innerHTML = `
            <h2>CIUDADANO</h2>
            <p>Palabra secreta:</p>
            <h2>${secretWord}</h2>
        `;
    }
};

nextBtn.onclick = () => {
    currentPlayer++;
    if (currentPlayer >= players.length) {
        revealDiv.classList.add("hidden");
        endScreen.classList.remove("hidden");
    } else {
        showPassScreen();
    }
};
</script>

</body>
</html>
