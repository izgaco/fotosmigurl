<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Juegos</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #e0e0e0;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 28px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 18px;
      margin: 15px 0;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .btn-impostor {
      background: #1976d2;
      color: white;
    }

    .btn-tabu {
      background: #c62828;
      color: white;
    }

    .btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎮 Elige un juego</h1>

    <button class="btn btn-impostor" onclick="irImpostor()">
      🕵️‍♂️ Impostor
    </button>

    <button class="btn btn-tabu" onclick="irTabu()">
      🟥 Tabú
    </button>
  </div>

  <script>
    function irImpostor() {
      window.location.href = "./impostor.html";
    }
  
    function irTabu() {
      window.location.href = "./tabu.html";
    }
  </script>
