<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #111;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: white;
            margin-bottom: 30px;
        }

        .boton {
            width: 220px;
            padding: 15px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #1e90ff;
            color: white;
        }

        .boton:hover {
            background: #187bcd;
        }
    </style>
</head>
<body>

    <h1>¿Qué quieres hacer?</h1>

    <button class="boton" onclick="location.href='imagen.html'">
        Mostrar imagen
    </button>

    <button class="boton" onclick="location.href='juego.html'">
        Juego
    </button>

</body>
</html>
