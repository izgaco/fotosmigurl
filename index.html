<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Elige un juego</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #e0e0e0;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 25px;
    }

    .btn {
      width: 100%;
      padding: 18px;
      margin: 15px 0;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .btn-red {
      background: #c62828;
      color: white;
    }

    .btn-gray {
      background: #9e9e9e;
      color: white;
    }

    .btn-purple {
      background: linear-gradient(135deg, #9b59b6, #e056fd);
      color: white;
    }

    .btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎮 Migurl Juegos</h1>

    <button class="btn btn-purple" onclick="window.location.href='dixit.html'">
      🎴 Dixit
    </button>

    <button class="btn btn-red" onclick="window.location.href='impostor.html'">
      Impostor
    </button>

    <button class="btn btn-gray" onclick="window.location.href='tabu.html'">
      Tabú
    </button>

    <button class="btn btn-gray" onclick="window.location.href='amigoinvisible.html'">
      Amigo invisible
    </button>

  </div>

</body>
</html>
