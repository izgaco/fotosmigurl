<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego del Impostor</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(160deg, #111, #333);
    color: #fff;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 420px;
    text-align: center;
}

h1 {
    font-size: 2rem;
    margin-bottom: 20px;
}

h2 {
    font-size: 1.5rem;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    font-size: 1.1rem;
    border-radius: 10px;
    border: none;
}

button {
    width: 100%;
    padding: 16px;
    margin: 12px 0;
    font-size: 1.2rem;
    font-weight: bold;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    background-color: #1e90ff;
    color: white;
}

button:active {
    transform: scale(0.98);
}

.hidden {
    display: none;
}

#roleDisplay {
    margin-top: 20px;
    padding: 25px;
    border-radius: 16px;
    font-size: 1.4rem;
    line-height: 1.5;
}

.citizen {
    background-color: #1b5e20;
}

.impostor {
    background-color: #b71c1c;
}

.footer {
    margin-top: 30px;
    font-size: 0.9rem;
    opacity: 0.7;
}
</style>
</head>

<body>

<div class="container">

<h1>🕵️ Juego del Impostor</h1>

<!-- CONFIGURACIÓN -->
<div id="setup">
    <input type="number" id="numPlayers" min="2" placeholder="Número de jugadores">
    <input type="number" id="numImpostors" min="1" placeholder="Número de impostores">
    <button id="setPlayersBtn">Siguiente</button>
</div>

<!-- NOMBRES -->
<div id="playerNames" class="hidden"></div>

<!-- REVELAR ROLES -->
<div id="roleReveal" class="hidden">
    <h2 id="currentPlayer"></h2>
    <button id="revealBtn">Revelar rol</button>
    <div id="roleDisplay" class="hidden"></div>
    <button id="nextBtn" class="hidden">Siguiente jugador</button>
</div>

</div>

<script>
let players = [];
let impostors = [];
let currentPlayerIndex = 0;
let numImpostors = 1;

const secretWords = [
    "gato", "playa", "avión", "pizza", "montaña",
    "película", "verano", "bosque", "fiesta", "café"
];

const secretWord = secretWords[Math.floor(Math.random() * secretWords.length)];

const setupDiv = document.getElementById("setup");
const playerNamesDiv = document.getElementById("playerNames");
const roleRevealDiv = document.getElementById("roleReveal");
const currentPlayerH2 = document.getElementById("currentPlayer");
const revealBtn = document.getElementById("revealBtn");
const roleDisplay = document.getElementById("roleDisplay");
const nextBtn = document.getElementById("nextBtn");

document.getElementById("setPlayersBtn").onclick = () => {
    const num = parseInt(document.getElementById("numPlayers").value);
    if (!num || num < 2) return alert("Introduce al menos 2 jugadores");
    setupDiv.classList.add("hidden");
    createPlayerInputs(num);
};

function createPlayerInputs(num) {
    playerNamesDiv.innerHTML = `<h2>Nombres de jugadores</h2>`;
    for (let i = 0; i < num; i++) {
        playerNamesDiv.innerHTML += `<input type="text" placeholder="Jugador ${i + 1}" id="player${i}">`;
    }
    playerNamesDiv.innerHTML += `
        <button id="startGameBtn">Comenzar</button>
    `;

    playerNamesDiv.classList.remove("hidden");

    document.getElementById("startGameBtn").onclick = () => {
        players = [];
        for (let i = 0; i < num; i++) {
            const name = document.getElementById(`player${i}`).value.trim();
            if (!name) return alert("Todos los jugadores deben tener nombre");
            players.push(name);
        }
        numImpostors = parseInt(document.getElementById("numImpostors").value);
        if (!numImpostors || numImpostors >= players.length)
            return alert("Número de impostores no válido");

        assignImpostors();
        playerNamesDiv.classList.add("hidden");
        startTurn();
    };
}

function assignImpostors() {
    impostors = [];
    while (impostors.length < numImpostors) {
        const rand = Math.floor(Math.random() * players.length);
        if (!impostors.includes(rand)) impostors.push(rand);
    }
}

function startTurn() {
    if (currentPlayerIndex >= players.length) {
        roleRevealDiv.innerHTML = "<h2>✅ Todos los roles repartidos<br>¡Comienza el juego!</h2>";
        return;
    }
    roleRevealDiv.classList.remove("hidden");
    roleDisplay.classList.add("hidden");
    nextBtn.classList.add("hidden");
    currentPlayerH2.textContent = players[currentPlayerIndex];
}

revealBtn.onclick = () => {
    roleDisplay.classList.remove("hidden");
    nextBtn.classList.remove("hidden");

    if (impostors.includes(currentPlayerIndex)) {
        roleDisplay.textContent = "IMPOSTOR";
        roleDisplay.className = "impostor";
    } else {
        roleDisplay.textContent = `CIUDADANO\n\nPalabra secreta:\n${secretWord}`;
        roleDisplay.className = "citizen";
    }
};

nextBtn.onclick = () => {
    currentPlayerIndex++;
    startTurn();
};
</script>

</body>
</html>
