<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego del Impostor</title>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #222;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 20px;
}

h1 { margin-bottom: 20px; }

button {
    padding: 10px 20px;
    margin: 10px;
    font-size: 16px;
    cursor: pointer;
}

#roleDisplay {
    margin: 20px;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    font-size: 20px;
}

.hidden { display: none; }

.red { background-color: #b00; color: white; }
.green { background-color: #0b0; color: white; }
/* Estilos responsivos para móviles */
@media (max-width: 600px) {
    body {
        font-size: 1.2em; /* Aumenta tamaño general del texto */
        padding: 15px;
    }

    h1, h2 {
        font-size: 1.5em; /* Titulares más grandes */
    }

    button {
        padding: 15px 25px; /* Botones más grandes */
        font-size: 18px;
    }

    #roleDisplay {
        font-size: 18px;
        padding: 25px;
    }

    input[type="number"], input[type="text"] {
        font-size: 18px;
        padding: 8px;
    }
}

</style>
</head>
<body>

<h1>Juego del Impostor</h1>

<div id="setup">
    <label>Cantidad de jugadores: <input type="number" id="numPlayers" min="2" value="3"></label>
    <button id="setPlayersBtn">Siguiente</button>
</div>

<div id="playerNames" class="hidden"></div>

<div id="roleReveal" class="hidden">
    <h2 id="currentPlayer"></h2>
    <button id="revealBtn">Revelar rol</button>
    <div id="roleDisplay" class="hidden"></div>
    <button id="nextBtn" class="hidden">Pasar al siguiente jugador</button>
</div>

<script>
let players = [];
let impostors = [];
let secretWord = "gato"; // Puedes cambiarlo o hacer array de palabras y escoger aleatoriamente
let currentPlayerIndex = 0;
let numImpostors = 0;

const setupDiv = document.getElementById("setup");
const playerNamesDiv = document.getElementById("playerNames");
const roleRevealDiv = document.getElementById("roleReveal");
const currentPlayerH2 = document.getElementById("currentPlayer");
const revealBtn = document.getElementById("revealBtn");
const roleDisplay = document.getElementById("roleDisplay");
const nextBtn = document.getElementById("nextBtn");
const numPlayersInput = document.getElementById("numPlayers");
const setPlayersBtn = document.getElementById("setPlayersBtn");

setPlayersBtn.addEventListener("click", () => {
    const num = parseInt(numPlayersInput.value);
    if(num < 2) { alert("Debe haber al menos 2 jugadores"); return; }
    setupDiv.classList.add("hidden");
    createNameInputs(num);
});

function createNameInputs(num) {
    playerNamesDiv.innerHTML = "<h2>Introduce los nombres de los jugadores</h2>";
    for(let i=0; i<num; i++){
        playerNamesDiv.innerHTML += `<label>Jugador ${i+1}: <input type="text" id="player${i}"></label><br>`;
    }
    playerNamesDiv.innerHTML += `<label>Cantidad de impostores: <input type="number" id="numImpostors" min="1" max="${num-1}" value="1"></label><br>`;
    playerNamesDiv.innerHTML += `<button id="startGameBtn">Comenzar juego</button>`;
    playerNamesDiv.classList.remove("hidden");

    document.getElementById("startGameBtn").addEventListener("click", () => {
        for(let i=0; i<num; i++){
            let name = document.getElementById(`player${i}`).value.trim();
            if(name === "") { alert("Todos los jugadores deben tener nombre"); return; }
            players.push(name);
        }
        numImpostors = parseInt(document.getElementById("numImpostors").value);
        if(numImpostors >= players.length) { alert("Debe haber menos impostores que jugadores"); return; }
        assignImpostors();
        playerNamesDiv.classList.add("hidden");
        startTurn();
    });
}

function assignImpostors(){
    let indices = [];
    while(indices.length < numImpostors){
        let rand = Math.floor(Math.random() * players.length);
        if(!indices.includes(rand)) indices.push(rand);
    }
    impostors = indices;
}

function startTurn(){
    if(currentPlayerIndex >= players.length){
        roleRevealDiv.innerHTML = "<h2>Todos los roles han sido repartidos. ¡Comienza el juego!</h2>";
        return;
    }
    roleRevealDiv.classList.remove("hidden");
    roleDisplay.classList.add("hidden");
    nextBtn.classList.add("hidden");
    currentPlayerH2.textContent = players[currentPlayerIndex];
}

revealBtn.addEventListener("click", () => {
    if(impostors.includes(currentPlayerIndex)){
        roleDisplay.textContent = "Impostor";
        roleDisplay.className = "red";
    } else {
        roleDisplay.textContent = `Ciudadano\nPalabra secreta: ${secretWord}`;
        roleDisplay.className = "green";
    }
    roleDisplay.classList.remove("hidden");
    nextBtn.classList.remove("hidden");
});

nextBtn.addEventListener("click", () => {
    currentPlayerIndex++;
    startTurn();
});
</script>

</body>
</html>
